<div class="top"><span class="crumb">Stillwater › Export</span><span class="pill">14 chapters</span></div>
  <div class="body"><div class="split">
    <div style="display:flex;flex-direction:column;gap:13px">
      <div class="card"><div class="sh"><h4>Package</h4></div>
        <div class="kb k2">
          <div class="f"><label>Format</label><select class="box"><option>MP3 · 192 kbps</option>
            <option>WAV 44.1/16</option><option>M4B chaptered</option><option>WAV 48/24</option></select></div>
          <div class="f"><label>Layout</label><select class="box"><option>One file per chapter</option>

          <div class="f"><label>Filename</label><input class="box mono" value="{nn}-{chapter}"></div>
          <div class="f"><label>Folder</label><div class="kr"><input class="box mono" value="E:\Books\Stillwater"><button class="btn s" onclick="toast('File picker')">…</button></div></div></div></div>
      <div class="card"><div class="sh"><h4>Metadata</h4></div>
        <div class="kb k2"><div class="f"><label>Title</label><input class="box" value="Stillwater"></div>
          <div class="f"><label>Author</label><input class="box" value="D. Lebash"></div>
          <div class="f"><label>Narrator credit</label><input class="box" value="Synthetic — JustVoice"></div>
          <div class="f"><label>Cover</label><div class="kr"><input class="box mono" value="cover.jpg"><button class="btn s" onclick="toast('File picker')">…</button></div></div></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card"><div class="sh"><h4>ACX check</h4></div>
        <table><tbody>
          <tr><td>RMS</td><td class="n">−20.4 dB</td><td><span class="tag ok">−23…−18</span></td></tr>

          <tr><td>Head / tail</td><td class="n">0.7 / 2.1 s</td><td><span class="tag ok">0.5–5</span></td></tr>
        </tbody></table>
        <button class="btn p" style="margin-top:10px;width:100%" onclick="toast('Exporting 14 chapters to E:\\Books\\Stillwater…','ok')">⤓ Export 14 chapters</button></div>
      <div class="card tint"><div class="sh"><h4>Also from here</h4></div>
        <div class="tags"><span class="tag">📦 .justvoice.zip</span><span class="tag">📄 script as text</span>
          <span class="tag">🎧 per-line stems</span><span class="tag">🏷️ Audacity labels</span></div></div>
    </div>
  </div></div>
