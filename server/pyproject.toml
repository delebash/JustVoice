[project]
name = "justvoice"
version = "0.0.1"
description = "An open-source TTS server built for audiobook production, useful for any TTS workload."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "JustVoice contributors" }]
keywords = ["tts", "text-to-speech", "audiobook", "speech-synthesis", "voice-cloning"]

# Core dependencies — these are needed even for the empty-engine
# install. ML/engine deps are extras so users can `pip install
# justvoice[kokoro]` or `[chatterbox]` etc.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "platformdirs>=4",
    "typer>=0.12",
    "rich>=13",
    "requests>=2.32",  # for download streaming with progress (HF + URL paths both stream via this)
    "psutil>=5.9",  # CPU/RAM detection in system_info (stdlib fallback exists)
    "sqlalchemy>=2.0",  # Phase 1.5: primary persistence layer (atomic JSON still used for settings.json only)
    "python-multipart>=0.0.18",  # multipart form parsing — backup/restore + /v1/projects/import
    "pyloudnorm>=0.1",  # EBU R128 LUFS measurement for ACX mastering verification + analyzer
    "tenacity>=8.2",  # prebuilt retry (backoff + jitter) for the webhook dispatcher — replaces a hand-rolled ladder
    "cachetools>=7.0",  # prebuilt TTL/LRU caches (voice-preview + render hot tier); >=7 for TTLCache LRU-on-access
    # Effects DSP. `pedalboard` was removed 2026-07-29: it is GPL-3.0 (it
    # statically links JUCE), and that single dependency was what forced the
    # whole project to GPL. Nothing else in this list is copyleft, so
    # replacing it is what makes an MIT relicense possible at all.
    # The twelve effects it provided now live in `justvoice/audio/dsp/`.
    "scipy>=1.11",  # sosfilt/lfilter — fast IIR. numpy alone cannot do recursive filters at speed. BSD-3-Clause
    "python-stretch>=0.3",  # Signalsmith Stretch bindings — pitch shift. MIT; prebuilt wheels incl. Windows
    # MCP server (Model Context Protocol) — local AI agents call
    # justvoice.speak / list_voices / list_personas at /mcp. Same major
    # pin as upstream voicebox.
    "fastmcp>=3.0,<4.0",
    # Shared local-LLM runner core (hardware detection, llama.cpp binary
    # acquisition, GGUF download, llama-server spawn + VRAM-fit). Its own
    # private repo, consumed as a PINNED git dependency (frozen into the
    # bundle via PyInstaller; NOT published to PyPI). Dev uses an editable
    # path install (`pip install -e ../just-llm-runner`), which takes
    # precedence over this pin. See docs/plans/2026-06-16-builtin-llm-runner.md.
    # Pinned to a commit SHA (no release tag yet); bump when just-llm-runner advances.
    "llm-runner @ git+https://github.com/delebash/just-llm-runner.git@e7d2f1ce0e49cc05f828c1c9a5d903a1ea58bbe9",
]

[project.optional-dependencies]
# Kokoro engine via k2-fsa's sherpa-onnx-python (Apache 2.0, same .onnx
# models as the previous Rust path through the sherpa-onnx crate).
kokoro = ["sherpa-onnx>=1.13"]

# Other TTS engines — each gates its own dependency tree.
chatterbox = ["chatterbox-tts>=0.2", "torch>=2.2"]
qwen3 = ["qwen-tts>=0.1", "torch>=2.2"]
all-engines = [
    "sherpa-onnx>=1.13",
    "chatterbox-tts>=0.2",
    "qwen-tts>=0.1",
    "torch>=2.2",
]

# Phase 5 training extras
training = [
    "peft>=0.13",
    "transformers>=4.45",
    "safetensors>=0.4",
    "faster-whisper>=1.0",  # for transcript-alignment QC
]

# Dev / test
dev = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.48", "ruff>=0.7"]

[project.scripts]
# Named `justvoice-server` (not `justvoice`) so it doesn't collide with the
# Tauri desktop binary, which is `justvoice.exe`. The Rust shell spawns
# this command in dev mode; on Windows, CreateProcessW resolves command
# names relative to the parent binary's directory first — using the same
# name would cause the shell to spawn itself, opening windows forever.
justvoice-server = "justvoice.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["justvoice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
