<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Justtts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  :root {
    --paper: #FAF8F3;
    --paper-elev: #FFFEFA;
    --ink: #1c1c1a;
    --ink-mid: #4a4640;
    --ink-dim: #7a7567;
    --line: #e8e3d4;
    --line-strong: #cdc4af;
    --accent: #1F3A2E;
    --accent-soft: #e9efe9;
    --danger: #8b2520;
    --danger-soft: #f4e4e3;

    --sans: 'Inter', -apple-system, system-ui, sans-serif;
    --serif: 'Newsreader', 'Iowan Old Style', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: 'ss01', 'cv11';
  }

  /* — Element resets — */
  button, input, textarea, select {
    font: inherit;
    color: inherit;
    background: var(--paper-elev);
    border: 1px solid var(--line-strong);
    border-radius: 0;
    padding: 10px 14px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  input, textarea, select {
    width: 100%;
    font-size: 14px;
    transition: border-color 120ms ease;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 110px;
    line-height: 1.6;
  }
  select {
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
      linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 34px;
  }
  ::placeholder { color: var(--ink-dim); opacity: 0.7; }
  ::selection { background: var(--accent); color: var(--paper); }

  button {
    cursor: pointer;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 18px;
    border: 1px solid var(--ink);
    background: var(--paper-elev);
    color: var(--ink);
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    letter-spacing: 0;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: 0.4; cursor: not-allowed; background: var(--paper-elev); color: var(--ink); }
  button.primary {
    background: var(--accent);
    color: var(--paper);
    border-color: var(--accent);
  }
  button.primary:hover { background: #142820; border-color: #142820; }
  button.danger {
    background: var(--paper-elev);
    color: var(--danger);
    border-color: var(--danger);
  }
  button.danger:hover { background: var(--danger); color: var(--paper); }
  button.bare {
    border: none;
    background: transparent;
    padding: 6px 2px;
    color: var(--danger);
    font-size: 12.5px;
  }
  button.bare:hover { background: transparent; color: #5a1410; text-decoration: underline; text-underline-offset: 3px; }

  /* — Labels (uppercase sans, the Mercury convention) — */
  label {
    display: block;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }

  /* — Top bar — */
  .topbar {
    display: flex;
    align-items: center;
    padding: 20px 40px;
    border-bottom: 1px solid var(--line);
    gap: 24px;
  }
  .topbar .logo {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: -0.005em;
    line-height: 1;
  }
  .topbar .logo .dot {
    color: var(--accent);
  }
  .topbar .ver {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }
  .topbar .status {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .topbar .status.warn { color: var(--danger); }
  .topbar .status .sq {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 999px;
  }
  .topbar .status.warn .sq { background: var(--danger); }

  /* — Tabs — */
  .tabs {
    display: flex;
    padding: 0 40px;
    gap: 32px;
    border-bottom: 1px solid var(--line);
  }
  .tabs .tab {
    padding: 18px 0;
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--ink-dim);
    cursor: pointer;
    border: none;
    background: transparent;
    border-bottom: 1.5px solid transparent;
    margin-bottom: -1px;
    transition: color 120ms ease, border-color 120ms ease;
    letter-spacing: 0.005em;
  }
  .tabs .tab:hover { color: var(--ink); background: transparent; }
  .tabs .tab.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
    font-weight: 500;
  }

  /* — Main — */
  main {
    padding: 56px 40px 80px;
    max-width: 1180px;
  }
  main .page-head {
    margin-bottom: 44px;
  }
  main h2 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 42px;
    letter-spacing: -0.018em;
    margin: 0 0 8px;
    font-variation-settings: 'opsz' 60;
  }
  main h2 .period { color: var(--accent); }
  main .lede {
    color: var(--ink-mid);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 580px;
  }
  main h3 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.005em;
    margin: 0 0 20px;
    font-variation-settings: 'opsz' 30;
  }

  section.block {
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }
  section.block:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }

  /* — Stats — */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
  }
  .stat {
    padding: 0 32px 0 0;
    border-right: 1px solid var(--line);
  }
  .stat + .stat { padding-left: 32px; }
  .stat:last-child { border-right: none; padding-right: 0; }
  .stat .k {
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.13em;
    margin-bottom: 14px;
  }
  .stat .v {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 68px;
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: oldstyle-nums tabular-nums;
    font-variation-settings: 'opsz' 72;
    display: inline-block;
  }
  .stat .v .unit {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: 19px;
    color: var(--ink-dim);
    margin-left: 6px;
    letter-spacing: -0.005em;
    font-variation-settings: 'opsz' 30;
  }
  .stat .x {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 12px;
    line-height: 1.4;
  }

  /* — Tables — */
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 12px 18px 12px 0;
    border-bottom: 1px solid var(--line-strong);
  }
  thead th:last-child { padding-right: 0; text-align: right; }
  tbody td {
    padding: 14px 18px 14px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  tbody td:last-child { padding-right: 0; text-align: right; }
  tbody td .em {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.005em;
    font-variation-settings: 'opsz' 24;
  }
  tbody td .mono {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-mid);
  }
  tbody tr:hover td { background: rgba(31, 58, 46, 0.025); }

  /* — Engine row — */
  .engines {
    border-top: 1px solid var(--line);
  }
  .engine {
    display: grid;
    grid-template-columns: 1fr 1fr 130px;
    align-items: baseline;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    gap: 24px;
  }
  .engine .name {
    font-family: var(--serif);
    font-style: normal;
    font-weight: 400;
    font-size: 18px;
    letter-spacing: -0.005em;
    font-variation-settings: 'opsz' 24;
  }
  .engine .name .qual {
    font-style: italic;
    font-weight: 300;
    color: var(--ink-dim);
    font-size: 15px;
    margin-left: 4px;
  }
  .engine .be {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-mid);
  }
  .engine .st {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: right;
  }
  .engine .st.off { color: var(--ink-dim); font-weight: 400; }

  /* — Forms — */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 32px; }
  .stack > * + * { margin-top: 24px; }
  .row { display: flex; align-items: center; gap: 18px; }

  /* — Tag — */
  .tag {
    display: inline-block;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
  }

  /* — Error band — */
  .errband {
    background: var(--danger-soft);
    border-left: 3px solid var(--danger);
    padding: 14px 22px;
    margin-bottom: 28px;
    color: var(--danger);
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .errband .lbl {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* — Empty state — */
  .empty {
    padding: 32px 0;
    color: var(--ink-dim);
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: 18px;
    text-align: center;
    font-variation-settings: 'opsz' 24;
  }

  /* — Audio — */
  audio { width: 100%; margin-top: 18px; }

  /* — Modal — */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(28, 28, 26, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal {
    background: var(--paper-elev);
    border: 1px solid var(--line-strong);
    padding: 28px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 {
    margin-top: 0;
  }

  /* — Range input — */
  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    padding: 0;
    border: none;
    background: transparent;
  }

  /* — Lexicon table row active highlight — */
  tbody tr.active td { background: var(--accent-soft); }

  /* — File input — */
  input[type=file] {
    padding: 7px 9px;
    font-family: var(--mono);
    font-size: 12px;
  }

  /* — Helper — */
  .endnote {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: 14px;
    color: var(--ink-dim);
    font-variation-settings: 'opsz' 20;
  }

  /* — Footer (colophon + connection) — */
  footer.colophon {
    border-top: 1px solid var(--line);
    padding: 28px 40px 32px;
    background: var(--paper);
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 24px;
    align-items: end;
  }
  footer.colophon label { font-size: 10px; margin-bottom: 6px; }
  footer.colophon input {
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 11px;
    background: var(--paper-elev);
  }
  footer.colophon .imp {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.5;
    font-variation-settings: 'opsz' 18;
    max-width: 240px;
    text-align: right;
  }

  /* — Task strip (inline progress for in-flight ops) — */
  .task-strip {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 9px 14px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 12px;
    margin: 0 0 14px;
    border-radius: 0;
  }
  .task-strip[data-status="completed"] { border-color: #2d9d2d; }
  .task-strip[data-status="failed"]    { border-color: #b00020; }
  .task-strip[data-status="cancelled"] { opacity: 0.6; }
  .task-spin {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ink);
    animation: task-pulse 1.2s ease-in-out infinite;
  }
  .task-spin[data-status="completed"] { background: #2d9d2d; animation: none; }
  .task-spin[data-status="failed"]    { background: #b00020; animation: none; }
  .task-spin[data-status="cancelled"] { background: var(--ink-dim); animation: none; }
  @keyframes task-pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.4; transform: scale(0.85); }
  }
  .task-label { font-weight: 600; font-size: 13px; }
  .task-stat {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .task-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #2d9d2d;
  }
  .task-stat[data-fresh="stalling"] .task-dot { background: #d97706; animation: task-pulse 1.2s ease-in-out infinite; }
  .task-stat[data-fresh="stuck"]    .task-dot { background: #b00020; animation: task-pulse 1.2s ease-in-out infinite; }
  .task-stat[data-fresh="stalling"] { color: #d97706; }
  .task-stat[data-fresh="stuck"]    { color: #b00020; }
  .task-track {
    flex-basis: 100%;
    height: 3px;
    background: var(--line);
    border-radius: 0;
    overflow: hidden;
    margin-top: 6px;
  }
  .task-fill {
    height: 100%;
    background: var(--ink);
    transition: width 200ms linear;
  }
  .task-spacer { flex: 1; min-width: 4px; }

  /* — Toasts — */
  .toast-stack {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
    pointer-events: none;
    max-width: 380px;
  }
  .toast {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--ink);
    color: var(--paper);
    font-size: 13px;
    line-height: 1.4;
    border-radius: 0;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    cursor: pointer;
    animation: toast-in 240ms cubic-bezier(.2,.7,.2,1) both;
    border-left: 3px solid var(--paper);
  }
  .toast[data-kind="success"] { border-left-color: #2d9d2d; }
  .toast[data-kind="error"]   { border-left-color: #b00020; background: #2a0a0e; }
  .toast[data-kind="info"]    { border-left-color: #3b82f6; }
  .toast-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--paper);
    flex-shrink: 0;
  }
  .toast[data-kind="success"] .toast-dot { background: #2d9d2d; }
  .toast[data-kind="error"]   .toast-dot { background: #ff5566; }
  .toast[data-kind="info"]    .toast-dot { background: #60a5fa; }
  .toast-msg { flex: 1; min-width: 0; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* — Install/uninstall progress — */
  .progress-cell {
    padding: 12px 16px 14px 16px;
    background: var(--paper);
    border-top: 1px solid var(--line);
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
  }
  .progress-phase {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 11px;
    min-width: 90px;
    color: var(--ink-dim);
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--ink);
    transition: width 200ms linear;
  }
  .progress-bar.phase-failed { background: #b00020; }
  .progress-bar.phase-completed { background: #2d9d2d; }
  .progress-bytes {
    font-family: var(--mono);
    min-width: 130px;
    text-align: right;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .progress-file { margin-top: 6px; }
  .progress-error {
    margin-top: 6px;
    color: #b00020;
  }

  /* — Animation — */
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .topbar, .tabs, main, footer.colophon {
    animation: rise 520ms cubic-bezier(.2,.7,.2,1) both;
  }
  .topbar       { animation-delay:   0ms; }
  .tabs         { animation-delay:  80ms; }
  main          { animation-delay: 180ms; }
  footer.colophon { animation-delay: 280ms; }

  /* — Scrollbar — */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--paper); }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border: 2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-dim); }

  /* — Compact — */
  @media (max-width: 900px) {
    .topbar, .tabs, main, footer.colophon { padding-left: 22px; padding-right: 22px; }
    .tabs { gap: 18px; overflow-x: auto; }
    .stats { grid-template-columns: 1fr; }
    .stat { border-right: none; border-bottom: 1px solid var(--line); padding: 22px 0; }
    .stat + .stat { padding-left: 0; }
    .stat:last-child { border-bottom: none; }
    .grid-2 { grid-template-columns: 1fr; }
    .engine { grid-template-columns: 1fr; gap: 4px; padding: 18px 0; }
    .engine .st { text-align: left; }
    main h2 { font-size: 34px; }
    footer.colophon { grid-template-columns: 1fr; }
    footer.colophon .imp { text-align: left; max-width: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
const { createApp, ref, computed, watch, onMounted } = Vue;

const VIEWS = [
  { id: 'overview', label: 'Overview', lede: 'Current state of the server, catalogue, and cache held on disk.' },
  { id: 'generate', label: 'Generate', lede: 'Pick a voice. Type the line. Apply delivery overlay. The server renders it.' },
  { id: 'chapter',  label: 'Chapter',  lede: 'Multi-line script in, mastered chapter out. The audiobook-production endpoint.' },
  { id: 'voices',   label: 'Voices',   lede: 'The full voice catalogue, by engine and language. Clone, design, import, or blend new voices.' },
  { id: 'train',    label: 'Train',    lede: 'Voice fine-tuning. LoRA adapters on top of base engines. Restart-survivable jobs.' },
  { id: 'personas', label: 'Personas', lede: 'Named characters bound to voices. Stable across sessions.' },
  { id: 'lexicons', label: 'Lexicons', lede: 'Pronunciation dictionaries. Make character names pronounce consistently every render.' },
  { id: 'compare',  label: 'Compare',  lede: 'Two WAV files in, side-by-side report out. Format, loudness, sample-level diff.' },
  { id: 'engines',  label: 'Engines',  lede: 'Install, switch, and manage TTS engines. Auto-recommended for your hardware.' },
  { id: 'cache',    label: 'Cache',    lede: 'Audio renders kept on disk so the same line costs nothing twice.' },
  { id: 'settings', label: 'Settings', lede: 'Operator knobs that take effect at runtime; some require a restart.' },
];

const BLEND_STRATEGIES = [
  { id: 'slerp', label: 'SLERP — spherical (best for normalized embeddings)' },
  { id: 'lerp', label: 'LERP — linear (fast, may go off-manifold)' },
  { id: 'weighted_sum', label: 'Weighted sum — N-way generalization' },
];

const EMOTIONS = [

    function fmtDb(n) {
      if (n === null || n === undefined) return '—';
      if (!isFinite(n)) return n > 0 ? '∞' : '−∞';
      return (n >= 0 ? '+' : '') + n.toFixed(2) + ' dB';

    // ─── Task strip (JustWrite-inspired) ──────────────────────────────
    // A single task store backing the inline progress strips shown on
    // Generate / Chapter / Engines tabs. Each surface pushes a task
    // when it kicks off an operation, polls progress, and removes the
    // task on completion. The store also exposes a "now" tick so the
    // elapsed counter updates live without each component owning a
    // timer.
    const tasks = ref([]);
    const taskNow = ref(Date.now());
    setInterval(() => { taskNow.value = Date.now(); }, 100);

    function pushTask(opts) {
      // opts: { id, label, kind: 'generate'|'chapter'|'install'|'train',
      //         status?, percent?, statsFn?: (task)=>string[], onCancel?: ()=>void }
      const task = {
        id: opts.id || `task-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
        label: opts.label,
        kind: opts.kind || 'generate',
        startedAt: Date.now(),
        lastUpdateAt: Date.now(),
        status: opts.status || 'running',
        percent: opts.percent ?? null,
        stats: opts.stats || [],
        statsFn: opts.statsFn || null,
        onCancel: opts.onCancel || null,
        cancelled: false,
      };
      tasks.value = [...tasks.value, task];
      return task;
    }
    function updateTask(id, patch) {
      const idx = tasks.value.findIndex(t => t.id === id);
      if (idx < 0) return;
      const next = { ...tasks.value[idx], ...patch, lastUpdateAt: Date.now() };
      tasks.value = [...tasks.value.slice(0, idx), next, ...tasks.value.slice(idx + 1)];
    }
    function removeTask(id) {
      tasks.value = tasks.value.filter(t => t.id !== id);
    }
    function cancelTask(id) {
      const t = tasks.value.find(x => x.id === id);
      if (!t || !t.onCancel) return;
      t.onCancel();
      updateTask(id, { cancelled: true, status: 'cancelled' });
      setTimeout(() => removeTask(id), 1200);
    }
    function elapsedSeconds(task) {
      return Math.max(0, (taskNow.value - task.startedAt) / 1000).toFixed(1);
    }
    function freshness(task) {
      if (task.status !== 'running') return null;
      const ago = taskNow.value - task.lastUpdateAt;
      if (ago < 3000) return 'fresh';
      if (ago < 10000) return 'stalling';
      return 'stuck';
    }
    function taskStats(task) {
      if (task.statsFn) return task.statsFn(task);
      return task.stats;
    }

    const probeResult = ref(null);       // { reachable, models, voices, server_hint, recommended_model, error }

    async function api(path, opts = {}) {

      const url = serverUrl.value.replace(/\/$/, '') + path;
      try {
        const res = await fetch(url, { ...opts, headers });

          const body = await res.text();
          throw new Error(`${res.status} ${res.statusText}: ${body}`);
        }
        const ct = res.headers.get('content-type') || '';
        if (ct.startsWith('audio/')) return await res.blob();
        if (ct.includes('json')) return await res.json();
        return await res.text();
      } catch (e) {
        error.value = String(e.message || e);

    function buildDelivery() {
      // Construct the optional-everywhere Delivery object the server
      // expects. Only include fields the user explicitly changed.
      const d = {};
      if (Math.abs(deliverySpeed.value - 1.0) > 0.001) d.speed = deliverySpeed.value;
      if (deliveryEmotion.value) d.emotion = deliveryEmotion.value;
      if (Math.abs(deliveryPitch.value) > 0.001) d.pitch = deliveryPitch.value;
      if (deliveryPauseBefore.value > 0) d.pause_before = deliveryPauseBefore.value;
      if (deliveryPauseAfter.value > 0) d.pause_after = deliveryPauseAfter.value;
      if (Math.abs(deliveryGain.value) > 0.001) d.gain_db = deliveryGain.value;
      if (deliveryInstruct.value.trim()) d.instruct = deliveryInstruct.value.trim();
      if (deliveryEngineJson.value.trim()) {
        try {
          d.engine = JSON.parse(deliveryEngineJson.value);
        } catch (e) {
          // Don't fail the whole render — surface the JSON error and
          // let the rest of the delivery overlay still apply.
          error.value = `Engine knobs JSON parse error: ${e.message}`;
        }
      }
      return Object.keys(d).length ? d : undefined;
    }

    async function generate() {
      renderBusy.value = true;
      if (renderAudio.value) {
        URL.revokeObjectURL(renderAudio.value);
        renderAudio.value = null;
      }
      const ctl = new AbortController();
      const wordCount = renderText.value.trim().split(/\s+/).filter(Boolean).length;
      const charCount = renderText.value.length;
      const task = pushTask({
        label: `Render · ${renderVoice.value}`,
        kind: 'generate',
        statsFn: (t) => {
          const stats = [`${charCount} chars`, `${wordCount} words`];
          if (t.bytesOut) {
            stats.push(`${(t.bytesOut / 1024).toFixed(1)} KB`);
            const elapsedSec = (taskNow.value - t.startedAt) / 1000;
            // Estimate audio duration: 16-bit mono PCM at 24kHz =
            // 48000 bytes/sec. Minus ~44 bytes for WAV header.
            const audioSec = Math.max(0, (t.bytesOut - 44)) / 48000;
            stats.push(`${audioSec.toFixed(1)}s audio`);
            if (audioSec > 0.1 && t.status === 'completed') {
              const rtf = elapsedSec / audioSec;
              stats.push(`${rtf.toFixed(2)}× realtime`);
              const wps = wordCount / Math.max(0.1, elapsedSec);
              stats.push(`${wps.toFixed(1)} words/s`);
            }
          }
          return stats;
        },
        onCancel: () => ctl.abort(),
      });
      try {
        const body = {
          voice: renderVoice.value,
          text: renderText.value,
          cache: false,
        };
        const delivery = buildDelivery();
        if (delivery) body.delivery = delivery;
        const blob = await api('/v1/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: ctl.signal,
        });
        updateTask(task.id, { bytesOut: blob.size, status: 'completed' });
        renderAudio.value = URL.createObjectURL(blob);
        setTimeout(() => removeTask(task.id), 1500);
      } catch (e) {
        if (!ctl.signal.aborted) {
          updateTask(task.id, { status: 'failed' });
          setTimeout(() => removeTask(task.id), 3500);
        }
      } finally {
        renderBusy.value = false;
      }
    }

    // ─── Render Chapter ────────────────────────────────────────────────
    async function renderChapter() {
      chapterBusy.value = true;
      if (chapterAudio.value) {
        URL.revokeObjectURL(chapterAudio.value);
        chapterAudio.value = null;
      }
      const ctl = new AbortController();
      const lines = chapterLines.value.split('\n').filter(l => l.trim());
      const totalWords = lines.reduce((sum, l) => sum + l.trim().split(/\s+/).filter(Boolean).length, 0);
      const totalChars = lines.reduce((sum, l) => sum + l.length, 0);
      const task = pushTask({
        label: `Chapter · ${lines.length} lines${chapterPreset.value ? ' · ' + chapterPreset.value : ''}`,
        kind: 'chapter',
        statsFn: (t) => {
          const stats = [`${lines.length} lines`, `${totalWords} words`, `${totalChars} chars`];
          if (t.bytesOut) {
            stats.push(`${(t.bytesOut / 1024 / 1024).toFixed(2)} MB`);
            const elapsedSec = (taskNow.value - t.startedAt) / 1000;
            const wps = totalWords / Math.max(0.1, elapsedSec);
            stats.push(`${wps.toFixed(1)} words/s`);
          }
          return stats;
        },
        onCancel: () => ctl.abort(),
      });
      try {
        const body = {
          lines: lines.map(text => ({ voice: chapterVoice.value, text })),
          between_lines: { silence_ms: Number(chapterSilenceMs.value) || 0 },
        };
        if (chapterPreset.value) body.master = chapterPreset.value;
        const blob = await api('/v1/render_chapter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: ctl.signal,
        });
        updateTask(task.id, { bytesOut: blob.size, status: 'completed' });
        chapterAudio.value = URL.createObjectURL(blob);
        setTimeout(() => removeTask(task.id), 1500);
      } catch (e) {
        if (!ctl.signal.aborted) {
          updateTask(task.id, { status: 'failed' });
          setTimeout(() => removeTask(task.id), 3500);
        }
      } finally {
        chapterBusy.value = false;
      }
    }

      } catch (_) { /* surfaced */ }

    async function installEngine(engineId, modelVariant) {
      engineBusy.value = { ...engineBusy.value, [engineId]: 'install' };
      engineProgress.value = { ...engineProgress.value, [engineId]: { phase: 'connecting', bytes_downloaded: 0, bytes_total: 0 } };
      try {
        const body = modelVariant ? { model_variant: modelVariant } : {};
        // Install returns 202 immediately with a job_id; the actual
        // download happens in a background task. We poll the job for
        // progress until it transitions to completed or failed.
        const accepted = await api(`/v1/engines/${engineId}/install`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const jobId = accepted.job_id;
        await pollInstallJob(engineId, jobId);
        await refreshEngines();
        await refreshVoices();
      } finally {
        engineBusy.value = { ...engineBusy.value, [engineId]: null };
        const finalState = engineProgress.value[engineId];
        // Auto-clear ONLY on success — failed states stick around so
        // the user can read the error. They go away on the next install
        // attempt for this engine or when the user clicks Dismiss /
        // hits Reload in the footer.
        if (finalState && finalState.phase === 'completed') {
          setTimeout(() => {
            const copy = { ...engineProgress.value };
            delete copy[engineId];
            engineProgress.value = copy;
          }, 3000);
        } else if (!finalState) {
          // Defensive: clear if somehow there's no final state
          const copy = { ...engineProgress.value };
          delete copy[engineId];
          engineProgress.value = copy;
        }
        // Failed: leave engineProgress[engineId] intact.
      }
    }

    function dismissEngineProgress(engineId) {
      const copy = { ...engineProgress.value };
      delete copy[engineId];
      engineProgress.value = copy;
    }

    async function pollInstallJob(engineId, jobId) {
      const installTask = pushTask({
        id: `install-${engineId}`,
        label: `Installing · ${engineId}`,
        kind: 'install',
        statsFn: (t) => {
          const stats = [];
          if (t.phase) stats.push(t.phase);
          if (t.bytesTotal > 0) {
            stats.push(`${(t.bytesDl / 1024 / 1024).toFixed(1)} / ${(t.bytesTotal / 1024 / 1024).toFixed(1)} MB`);
            // Throughput from start (smoothes across phases — better
            // than instantaneous which jitters)
            const elapsedSec = (taskNow.value - t.startedAt) / 1000;
            if (elapsedSec > 1.0 && t.bytesDl > 0) {
              const mbps = (t.bytesDl / 1024 / 1024) / elapsedSec;
              stats.push(`${mbps.toFixed(1)} MB/s`);
              if (t.bytesTotal > t.bytesDl) {
                const etaSec = (t.bytesTotal - t.bytesDl) / (t.bytesDl / elapsedSec);
                stats.push(`~${Math.ceil(etaSec)}s ETA`);
              }
            }
          }
          return stats;
        },
      });
      while (true) {
        try {
          const job = await api(`/v1/jobs/${jobId}`);
          engineProgress.value = { ...engineProgress.value, [engineId]: {
            phase: job.phase,
            bytes_downloaded: job.bytes_downloaded || 0,
            bytes_total: job.bytes_total || 0,
            current_file: job.current_file || null,
            error: job.error || null,
          } };
          updateTask(installTask.id, {
            phase: job.phase,
            bytesDl: job.bytes_downloaded || 0,
            bytesTotal: job.bytes_total || 0,
            percent: job.bytes_total ? Math.min(100, Math.round(100 * (job.bytes_downloaded || 0) / job.bytes_total)) : null,
          });
          if (job.phase === 'completed') {
            updateTask(installTask.id, { status: 'completed' });
            toast(`${engineId} installed. Click Load to use it.`, { kind: 'success', duration: 5000 });
            setTimeout(() => removeTask(installTask.id), 1500);
            return;
          }
          if (job.phase === 'failed') {
            updateTask(installTask.id, { status: 'failed' });
            toast(`${engineId} install failed: ${job.error || 'unknown error'}`, { kind: 'error', duration: 8000 });
            setTimeout(() => removeTask(installTask.id), 4000);
            return;
          }
        } catch (e) {
          engineProgress.value = { ...engineProgress.value, [engineId]: { phase: 'failed', error: String(e), bytes_downloaded: 0, bytes_total: 0 } };
          updateTask(installTask.id, { status: 'failed' });
          setTimeout(() => removeTask(installTask.id), 4000);
          return;
        }
        await new Promise(r => setTimeout(r, 800));
      }
    }

    async function loadEngine(engineId) {
      engineBusy.value = { ...engineBusy.value, [engineId]: 'load' };
      try {
        await api(`/v1/engines/${engineId}/load`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device: 'auto' }),
        });
        await refreshEngines();
        // Loading an engine surfaces its preset voices — refresh the
        // voices catalog so the Generate/Persona pickers see them.
        await refreshVoices();
      } finally {
        engineBusy.value = { ...engineBusy.value, [engineId]: null };
      }
    }

    async function uninstallEngine(engineId) {
      const ok = await customConfirm({
        title: `Uninstall ${engineId}?`,
        message: `Model files will be removed from disk. You'll need to download them again to use ${engineId}.`,
        confirmLabel: 'Uninstall',
        confirmStyle: 'danger',
      });
      if (!ok) return;
      engineBusy.value = { ...engineBusy.value, [engineId]: 'uninstall' };
      try {
        await api(`/v1/engines/${engineId}`, { method: 'DELETE' });
        await refreshEngines();
        // After uninstall, voices for the removed engine may be stale —
        // refresh the voice catalog too.
        const v = await api('/v1/voices');
        voices.value = v.voices;
        toast(`${engineId} uninstalled.`);
      } finally {
        engineBusy.value = { ...engineBusy.value, [engineId]: null };
      }
    }

    async function unloadEngine() {
      engineBusy.value = { ...engineBusy.value, _global: 'unload' };
      try {
        const resp = await api(`/v1/engines/unload`, { method: 'POST' });
        await refreshEngines();
        // Some sidecar engines hide their preset voices when unloaded —
        // refresh so the picker reflects reality.
        await refreshVoices();
        const prev = resp?.previous_engine;
        toast(prev ? `${prev} unloaded — VRAM freed.` : 'No engine was loaded.');
      } finally {
        engineBusy.value = { ...engineBusy.value, _global: null };
      }
    }

    async function deleteVoice(voiceId) {
      const ok = await customConfirm({
        title: 'Delete voice?',
        message: `Voice "${voiceId}" will be permanently removed. Personas that reference it will keep the id but fail to render until rebound.`,
        confirmLabel: 'Delete',
        confirmStyle: 'danger',
      });
      if (!ok) return;
      try {
        await api(`/v1/voices/${voiceId}`, { method: 'DELETE' });
        await refreshVoices();
        toast(`Voice "${voiceId}" deleted.`);
      } catch (_) { /* surfaced */ }

    // ─── Lexicons ─────────────────────────────────────────────────────
    async function refreshLexicons() {
      try {
        const lx = await api('/v1/lexicons');
        lexicons.value = lx.lexicons || [];
      } catch (_) { /* surfaced */ }

    async function createLexicon() {
      if (!lexNewName.value.trim()) return;
      await api('/v1/lexicons', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: lexNewName.value, entries: [] }),
      });
      lexNewName.value = '';
      await refreshLexicons();
    }

    async function deleteLexicon(id) {
      const ok = await customConfirm({
        title: 'Delete lexicon?',
        message: 'All entries in this lexicon will be removed.',
        confirmLabel: 'Delete',
        confirmStyle: 'danger',

      if (!ok) return;
      await api(`/v1/lexicons/${id}`, { method: 'DELETE' });
      await refreshLexicons();

      if (!lexSelectedId.value || !lexNewGrapheme.value.trim()) return;
      const entry = { grapheme: lexNewGrapheme.value };

      await api(`/v1/lexicons/${lexSelectedId.value}/entries`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entry),
      });
      lexNewGrapheme.value = '';
      lexNewPhoneme.value = '';
      lexNewAlias.value = '';
      await refreshLexicons();
    }

    // ─── Voice clone / design / import / blend ────────────────────────
    function openVoiceModal(kind) {
      voiceModal.value = kind;
      voiceCloneName.value = '';
      voiceCloneFile.value = null;

      voiceDesignName.value = '';
      voiceDesignPrompt.value = '';

      voiceImportFile.value = null;
      blendName.value = '';
      blendEngine.value = '';
      blendStrategy.value = 'slerp';

    }

    function closeVoiceModal() {
      voiceModal.value = null;
    }

    async function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => {
          const dataUrl = r.result;
          const comma = dataUrl.indexOf(',');
          resolve(comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl);
        };
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    async function submitClone() {
      if (!voiceCloneName.value.trim() || !voiceCloneFile.value) return;
      voiceBusy.value = true;
      try {
        const ref_wav_b64 = await readFileAsBase64(voiceCloneFile.value);
        await api('/v1/voices/clone', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: voiceCloneName.value,
            ref_wav_b64,
            transcript: voiceCloneTranscript.value || undefined,
          }),
        });
        const v = await api('/v1/voices');
        voices.value = v.voices;
        closeVoiceModal();
      } finally {
        voiceBusy.value = false;
      }
    }

    async function submitDesign() {
      if (!voiceDesignName.value.trim() || !voiceDesignPrompt.value.trim()) return;
      voiceBusy.value = true;
      try {
        await api('/v1/voices/design', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: voiceDesignName.value, prompt: voiceDesignPrompt.value }),
        });
        const v = await api('/v1/voices');
        voices.value = v.voices;
        closeVoiceModal();
      } finally {
        voiceBusy.value = false;
      }
    }

    async function submitImport() {
      if (!voiceImportName.value.trim() || !voiceImportFile.value) return;
      voiceBusy.value = true;
      try {
        const wav_b64 = await readFileAsBase64(voiceImportFile.value);
        await api('/v1/voices/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: voiceImportName.value, wav_b64 }),
        });
        const v = await api('/v1/voices');
        voices.value = v.voices;
        closeVoiceModal();
      } finally {
        voiceBusy.value = false;
      }
    }

    function addBlendSource() {
      blendSources.value.push({ voice_id: '', weight: 1.0 });
    }
    function removeBlendSource(idx) {
      if (blendSources.value.length > 2) blendSources.value.splice(idx, 1);
    }

    async function submitBlend() {
      if (!blendName.value.trim() || !blendEngine.value) return;
      const valid = blendSources.value.filter(s => s.voice_id);
      if (valid.length < 2) return;
      voiceBusy.value = true;
      try {
        await api('/v1/voices/blend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            engine: blendEngine.value,
            name: blendName.value,
            source_voice_ids: valid.map(s => s.voice_id),
            weights: valid.map(s => Number(s.weight) || 1.0),
            strategy: blendStrategy.value,
          }),
        });
        const v = await api('/v1/voices');
        voices.value = v.voices;
        closeVoiceModal();
      } finally {
        voiceBusy.value = false;
      }
    }

    // ─── Training ──────────────────────────────────────────────────────
    async function refreshTrainJobs() {
      try {
        const t = await api('/v1/train');
        trainJobs.value = t.jobs || [];
      } catch (_) { /* surfaced */ }
    }

    function addTrainFile(event) {
      const files = Array.from(event.target.files || []);
      for (const file of files) {
        trainFiles.value.push({ file, transcript: '' });
      }
      event.target.value = '';
    }
    function removeTrainFile(idx) {
      trainFiles.value.splice(idx, 1);
    }

    async function submitTrain() {
      if (!trainName.value.trim() || !trainEngine.value) return;
      if (!trainFiles.value.length) return;
      trainBusy.value = true;
      try {
        const samples = await Promise.all(
          trainFiles.value.map(async ({ file, transcript }) => ({
            wav_b64: await readFileAsBase64(file),
            transcript: transcript || '',
          })),
        );
        const body = {
          engine: trainEngine.value,
          name: trainName.value,
          samples,
        };
        if (trainEpochs.value) body.epochs = Number(trainEpochs.value);
        if (trainLearningRate.value) body.learning_rate = Number(trainLearningRate.value);
        if (trainBaseVoice.value) body.base_voice = trainBaseVoice.value;
        await api('/v1/train', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        trainName.value = '';
        trainEpochs.value = '';
        trainLearningRate.value = '';
        trainBaseVoice.value = '';
        trainFiles.value = [];
        await refreshTrainJobs();
      } finally {
        trainBusy.value = false;
      }
    }

    async function cancelTrainJob(id) {
      const ok = await customConfirm({
        title: 'Cancel training job?',
        message: `Job ${id} will be stopped. Already-trained adapter weights up to the cancellation point are preserved.`,
        confirmLabel: 'Cancel job',
        confirmStyle: 'danger',
      });
      if (!ok) return;
      await api(`/v1/train/${id}`, { method: 'DELETE' });
      await refreshTrainJobs();
    }

        headers: { 'Content-Type': 'application/json' },

      await api(`/v1/personas/${id}`, { method: 'DELETE' });
      const p = await api('/v1/personas');
      personas.value = p.personas;
      toast('Persona released.');
    }

    async function clearCache(scope) {
      const q = scope ? `?scope=${encodeURIComponent(scope)}` : '';
      await api(`/v1/cache/clear${q}`, { method: 'POST' });
      cacheStats.value = await api('/v1/cache/stats');

      return (bytes / 1024 / 1024).toFixed(1);

          </div>
          <div class="row">
            <button class="primary" @click="renderChapter" :disabled="chapterBusy">
              {{ chapterBusy ? 'Rendering chapter…' : 'Render chapter' }}

            <span class="endnote">POST /v1/render_chapter &rarr; audio/wav or audio/mpeg (with mastering)</span>
          </div>
          <audio v-if="chapterAudio" :src="chapterAudio" :key="chapterAudio" controls></audio>
        </section>

      <!-- ─── Voices ─── -->
      <template v-if="view === 'voices'">

          <h3>Add a voice</h3>

            <button @click="openVoiceModal('blend')">Blend voices</button>

            <strong>Clone</strong>: 3-30 second reference WAV → cloned voice (Qwen3, Chatterbox).
            <strong>Design</strong>: prose description → voice (Qwen3 native).
            <strong>Import</strong>: bring your own clip as-is, no synthesis training.
            <strong>Blend</strong>: interpolate between two or more voices in embedding space (engines with <span class="mono">supports_embedding_blending</span>).

                <td><span class="tag">{{ v.engine }}</span></td>

                <td>{{ v.language }}</td>
                <td><span class="mono">{{ v.id }}</span></td>

          <div v-else class="empty">No voices registered. Install + load an engine to see preset voices.</div>
