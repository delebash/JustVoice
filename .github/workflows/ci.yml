# SPDX-License-Identifier: MIT
name: CI

# Run by hand only (Actions → CI → Run workflow) — the user, 2026-10-17: "it should be onluy
# run by hand".
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The app needs the family kit and the sync engine beside it (server/package.json:
# file:../../just-core/packages/core and file:../../just-sqlite-sync; quasar.config.js:
# ../just-core/packages/ui), so every job checks all three out side by side.
jobs:
  # ── Renderer (Vue + Vite) ─────────────────────────────────────────────────
  renderer:
    name: Renderer — Biome, unit tests, Quasar build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: JustVioce
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-core
          path: just-core
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-sqlite-sync
          path: just-sqlite-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            JustVioce/package-lock.json
            JustVioce/src-electron/package-lock.json
            just-core/packages/core/package-lock.json
            just-sqlite-sync/package-lock.json
      - name: Install the kit's server deps
        working-directory: just-core/packages/core
        run: npm ci
      - name: Install the sync engine's deps
        working-directory: just-sqlite-sync
        run: npm ci --omit=dev
      - name: Install deps
        working-directory: JustVioce
        run: npm ci
      - name: Biome
        working-directory: JustVioce
        run: npx biome check .
      - name: Unit tests
        working-directory: JustVioce
        run: npm run test:unit
      - name: Build renderer
        working-directory: JustVioce
        run: node node_modules/@quasar/app-vite/bin/quasar.js build

  # ── Node server ───────────────────────────────────────────────────────────
  server:
    name: Server — vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: JustVioce
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-core
          path: just-core
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-sqlite-sync
          path: just-sqlite-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            JustVioce/package-lock.json
            JustVioce/src-electron/package-lock.json
            just-core/packages/core/package-lock.json
            just-sqlite-sync/package-lock.json
      - name: Install the kit's server deps
        working-directory: just-core/packages/core
        run: npm ci
      - name: Install the sync engine's deps
        working-directory: just-sqlite-sync
        run: npm ci --omit=dev
      - name: Install deps
        working-directory: JustVioce
        run: npm ci
      - name: Install the desktop app's deps (Electron, which the server's scripts run as Node)
        working-directory: JustVioce/src-electron
        run: npm ci
      # The tests that need the audio.cpp DSP program (audiocpp_dsp) skip without it; CI has
      # no audio.cpp build.
      - name: vitest
        working-directory: JustVioce
        run: npm run test:server
