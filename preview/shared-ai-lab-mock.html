<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!--
  Action Lab — mock v2. ONE Lab framework; the action selector switches it
  between an LLM action (prompt + sampling settings, compare = text output)
  and a TTS action (voice + engine knobs, compare = audio variants). Same
  shell, compare, and Apply-to-route in both — proving the framework is shared;
  only the settings schema + the rendered output differ per action type.
  Companion to shared-ai-models-mock.html. Plan: docs/plans/2026-06-20-shared-ai-stack-plan.md
-->
<html lang="en"><head><meta charset="utf-8"><title>Shared AI · Action Lab — mock v2</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--surface-2:#fbfaf7;--surface-3:#f3f1ec;--ink:#1a1a1a;--ink-2:#4a4a4a;--ink-3:#888;
--line:#e3e1dc;--line-strong:#cfccc4;--accent:#3a7d63;--accent-ink:#2c6049;--accent-soft:#e8f0eb;--accent-line:#b8d2c3;
--gold:#b08a3e;--gold-soft:#f5edda;--gold-line:#e2d2b0;--red:#b04a3e;--blue:#2f74b5;--blue-soft:#eaf0f8;
--violet:#6a4a8c;--violet-soft:#f1eaf8;--violet-line:#d8c8e8;
--font-ui:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-serif:Georgia,serif;--font-mono:"SF Mono",Consolas,Menlo,monospace;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.page{max-width:1280px;margin:0 auto;padding:20px 28px 90px}
h1{font-family:var(--font-serif);font-size:22px;margin:0;display:flex;align-items:center;gap:10px}
.lede{color:var(--ink-2);font-size:13px;margin:4px 0 0;max-width:920px}.mono{font-family:var(--font-mono)}.muted{color:var(--ink-3)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}.brand{font-weight:800;font-size:15px}
.shared{font-size:11px;color:var(--violet);background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:999px;padding:3px 10px;font-weight:700}
.back{margin-left:auto;font-size:12px;color:var(--accent-ink);text-decoration:underline;cursor:pointer}
.actionsel{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface);font-family:var(--font-serif)}
.ttsbadge{font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--blue-soft);color:var(--blue);border:1px solid #c8d4e8}
.llmbadge{font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line)}
.btn{font:inherit;font-size:12.5px;font-weight:600;border-radius:7px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-ink)}
.btn.sm{font-size:11.5px;padding:4px 10px}.btn:hover{border-color:var(--line-strong)}
.lab{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(20,22,24,.05);padding:16px 18px}
.panel h3{font-family:var(--font-serif);font-size:15px;margin:0 0 4px}
.lab-h{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
label.t{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);display:block;margin:10px 0 4px}
textarea{font:inherit;font-size:12.5px;width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface-2);resize:vertical;min-height:60px;box-sizing:border-box}
select,input[type=number],input[type=text]{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.set{display:flex;flex-direction:column;gap:3px}.set label{font-size:11px;color:var(--ink-2)}.set input{width:100%;box-sizing:border-box}
.set .rng{display:flex;align-items:center;gap:6px}.set .rng input{flex:1}.set .rng .v{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);min-width:26px;text-align:right}
.toggle{position:relative;width:34px;height:19px;border-radius:999px;background:var(--accent);display:inline-block}.toggle i{position:absolute;top:2px;left:17px;width:15px;height:15px;border-radius:50%;background:#fff}
.adv summary{cursor:pointer;font-size:11.5px;color:var(--accent-ink);margin-top:10px}
.grphead{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 6px}
.set input[type=text]{width:100%;box-sizing:border-box}
.sample{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.cmp-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.cmp-head .run{margin-left:auto}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.col{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.col.win{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.col .ch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}.col .ch select{flex:1;min-width:0}
.tagm{font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 7px}.tagm.free{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line)}.tagm.paid{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line)}
.col .out{padding:11px 13px;flex:1;font-size:12.5px}
.line{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}.line:last-child{border-bottom:0}.line .sp{font-weight:700;min-width:90px}.line .tx{color:var(--ink-2);flex:1}.conf{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}.diff{background:#fff6da}
.col .cf{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);background:var(--surface-2);font-size:11.5px}.col .cf .m{color:var(--ink-3);font-family:var(--font-mono)}
.addcol{border:1px dashed var(--line-strong);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;cursor:pointer;min-height:120px}.addcol:hover{color:var(--accent-ink);border-color:var(--accent-line)}
/* audio (TTS) */
.player{display:flex;align-items:center;gap:10px}
.play{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:13px}
.wave{display:flex;align-items:center;gap:2px;height:38px;flex:1}.wave i{width:3px;background:var(--accent-line);border-radius:2px}
.dur{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.kv{font-size:11px;color:var(--ink-2);margin-top:8px}.kv b{font-family:var(--font-mono);color:var(--ink)}
.applybar{position:sticky;bottom:0;margin-top:18px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--accent-line);border-radius:12px;box-shadow:0 6px 24px rgba(20,22,24,.10);padding:14px 18px}
.applybar .w{font-size:13px}.applybar .w b{color:var(--accent-ink)}
.note{font-size:11.5px;color:var(--ink-3);margin-top:10px;font-style:italic}.kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
</style></head><body><div class="page">

<div class="topbar"><span class="brand">JustVoice</span><span class="shared">shared · @delebash/llm-ui · Lab</span><span class="back" onclick="history.back()">← back to Features</span></div>
<h1>Lab · <select class="actionsel" id="asel" onchange="render(this.value)">
  <optgroup label="LLM actions"><option value="attribution" selected>Speaker attribution</option><option value="entities">Entity extraction (objects / locations)</option><option value="rewrite">Rewrite in character</option></optgroup>
  <optgroup label="TTS actions"><option value="narration">Narration render</option><option value="dialogue">Dialogue render</option></optgroup>
</select> <span id="typebadge"></span></h1>
<p class="lede">Tune one action — prompt + settings — compare candidates side-by-side on real input, then Apply to make it this action's default.</p>

<div id="labroot"></div>

<script>
function bars(seed){let s=seed,o='';for(let i=0;i<46;i++){s=(s*9301+49297)%233280;const h=6+Math.round((s/233280)*30);o+=`<i style="height:${h}px"></i>`;}return o;}

// ── LLM action lab ───────────────────────────────────────────────
function llmLab(){return `<div class="lab">
 <div class="panel"><h3>Config</h3>
   <div class="lab-h">Testing on</div><div class="sample">📄 <select style="flex:1"><option selected>Ch. 6 — "The Cartographer's Daughter"</option><option>Ch. 1</option><option>Paste a snippet…</option></select></div>
   <div class="lab-h">Prompt</div>
   <label class="t">System prompt</label><textarea>You attribute every line of dialogue to the character who speaks it. Use ONLY the provided cast. Never invent a speaker; when uncertain, lower the confidence rather than guess.</textarea>
   <label class="t">User prompt template</label><textarea>Cast: {{cast}}

Chapter:
{{chapter_text}}

Return JSON: [{ "line", "speaker", "confidence" }].</textarea>
   <div class="muted" style="font-size:10.5px;margin-top:3px">Variables: <span class="mono">{{cast}}</span> <span class="mono">{{chapter_text}}</span> — filled at run time · <span style="color:var(--accent-ink)">↺ reset prompt</span></div>
   <div style="margin-top:8px;display:flex;align-items:center;gap:8px"><button class="btn sm" style="padding:3px 10px">+ Add review pass</button><span class="muted" style="font-size:10.5px">optional second prompt that reviews the output</span></div>
   <div class="lab-h" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;margin-top:14px">Settings sent to the model <button class="btn sm" style="padding:2px 8px">↺ Reset to defaults</button></div>
   <div class="muted" style="font-size:11px;margin:-2px 0 8px">Cloud providers show only the settings they support. Defaults shown — tune or reset.</div>
   <div class="grphead">Sampling</div>
   <div class="settings"><div class="set"><label>Temperature</label><input type="number" value="0.2" step="0.1"></div><div class="set"><label>Top-K</label><input type="number" value="40"></div><div class="set"><label>Top-P</label><input type="number" value="0.95" step="0.05"></div><div class="set"><label>Min-P</label><input type="number" value="0.05" step="0.05"></div></div>
   <details class="adv"><summary>more sampling ▾</summary><div class="settings" style="margin-top:6px"><div class="set"><label>Dyn-temp range</label><input type="number" value="0"></div><div class="set"><label>Dyn-temp exp</label><input type="number" value="1"></div><div class="set"><label>XTC probability</label><input type="number" value="0"></div><div class="set"><label>XTC threshold</label><input type="number" value="0.1"></div><div class="set"><label>Typical-P</label><input type="number" value="1"></div><div class="set"><label>Sampler order</label><input type="text" value="top_k·typ_p·top_p·min_p·temp"></div></div></details>
   <div class="grphead">Penalties</div>
   <div class="settings"><div class="set"><label>Repeat last N</label><input type="number" value="64"></div><div class="set"><label>Repeat penalty</label><input type="number" value="1.0" step="0.05"></div><div class="set"><label>Presence</label><input type="number" value="0" step="0.1"></div><div class="set"><label>Frequency</label><input type="number" value="0" step="0.1"></div></div>
   <details class="adv"><summary>DRY ▾</summary><div class="settings" style="margin-top:6px"><div class="set"><label>DRY multiplier</label><input type="number" value="0"></div><div class="set"><label>DRY base</label><input type="number" value="1.75"></div><div class="set"><label>DRY allowed len</label><input type="number" value="2"></div><div class="set"><label>DRY penalty last N</label><input type="number" value="-1"></div></div></details>
   <div class="grphead">Reasoning &amp; output</div>
   <div class="settings"><div class="set"><label>Enable thinking</label><span class="toggle"><i></i></span></div><div class="set"><label>Exclude reasoning from ctx</label><span class="toggle" style="background:var(--line-strong)"><i style="left:2px"></i></span></div><div class="set"><label>Max tokens</label><input type="number" value="2048"></div><div class="set"><label>Seed</label><input type="number" placeholder="random"></div></div>
   <details class="adv"><summary>Custom JSON (pass-through) ▾</summary><textarea style="margin-top:6px;min-height:42px" placeholder='{ "grammar": "…", "logit_bias": [] }'></textarea><div class="muted" style="font-size:10.5px">Any param we don't surface — sent straight to the API.</div></details>
   <div class="grphead">Feature option</div>
   <div class="settings"><div class="set"><label>Confidence floor</label><input type="number" value="0.5" step="0.05"></div></div>
   <div class="muted" style="font-size:10.5px;margin-top:3px">app-level (speaker attribution) — not a model param</div>
 </div>
 <div><div class="cmp-head"><h3 style="font-family:var(--font-serif);font-size:15px;margin:0">Compare candidates</h3><span class="muted" style="font-size:12px">same prompt + settings · different model</span><span class="run"><button class="btn primary sm">▶ Run all</button> <span class="muted" style="font-size:11px"><span class="kbd">⌘↵</span></span></span></div>
   <div class="cols">
     <div class="col win"><div class="ch"><input type="radio" name="w" checked><select><option selected>Built-in runner ▸ qwen3-4b</option><option>Ollama ▸ qwen3:14b</option></select><span class="tagm free">FREE</span></div>
       <div class="out"><div class="line"><span class="sp">Elen</span><span class="tx">"You drew this from memory?"</span><span class="conf">0.98</span></div><div class="line"><span class="sp">Halvard</span><span class="tx">"Every ridge of it."</span><span class="conf">0.95</span></div><div class="line"><span class="sp">Elen</span><span class="tx">"Then the eastern pass is wrong."</span><span class="conf">0.91</span></div><div class="line diff"><span class="sp">Halvard</span><span class="tx">"…is it." <span class="muted">(borderline)</span></span><span class="conf">0.72</span></div></div>
       <div class="cf"><span class="m">12/12 · 1 low-conf</span><span style="margin-left:auto" class="m">1.9 s · 0 ¢</span></div></div>
     <div class="col"><div class="ch"><input type="radio" name="w"><select><option selected>Anthropic ▸ claude-sonnet-4-6</option></select><span class="tagm paid">METERED</span></div>
       <div class="out"><div class="line"><span class="sp">Elen</span><span class="tx">"You drew this from memory?"</span><span class="conf">0.99</span></div><div class="line"><span class="sp">Halvard</span><span class="tx">"Every ridge of it."</span><span class="conf">0.98</span></div><div class="line"><span class="sp">Elen</span><span class="tx">"Then the eastern pass is wrong."</span><span class="conf">0.96</span></div><div class="line diff"><span class="sp">narration</span><span class="tx">"…is it." <span class="muted">(read as narration)</span></span><span class="conf">0.88</span></div></div>
       <div class="cf"><span class="m">11/12 · 1 narration</span><span style="margin-left:auto" class="m">2.4 s · ≈0.7 ¢</span></div></div>
   </div>
   <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px"><div class="addcol">+ Add a model column</div><div></div></div>
 </div></div>
 <div class="applybar"><div class="w">Selected: <b>Built-in runner ▸ qwen3-4b</b> — free, 12/12, your edited prompt + temp 0.2.</div><span style="flex:1"></span><button class="btn sm">Save as named preset</button><button class="btn primary">Apply to route → default for “Speaker attribution”</button></div>`;}

// ── TTS action lab (same framework; per-voice settings adapt to the engine; + render/batch layer) ──
// Per-voice settings branch by engine paradigm (Alexandria reference): Chatterbox = numeric
// knobs; Qwen3-TTS = instruct/style text (no knobs); Kokoro = preset voice + speed only.
function ttsVoiceSettings(eng){
 const head='<div class="lab-h" style="display:flex;align-items:center;justify-content:space-between">Per-voice settings <button class="btn sm" style="padding:2px 8px">↺ Reset to defaults</button></div>';
 if(eng==='qwen3') return head+'<div class="grphead">Qwen3-TTS · instruct-driven</div>'+
   '<label class="t">Character style (instruct)</label><textarea>Warm, calm narrator; measured pace; subtle gravitas; never theatrical.</textarea>'+
   '<div class="muted" style="font-size:10.5px">No numeric knobs — Qwen3-TTS is steered by this style instruct, prepended to every line.</div>'+
   '<div class="settings" style="margin-top:8px"><div class="set"><label>Speed</label><div class="rng"><input type="range" min="0.5" max="1.5" step="0.05" value="1.0"><span class="v">1.0×</span></div></div><div class="set"><label>Seed</label><input type="number" placeholder="random"></div></div>';
 if(eng==='kokoro') return head+'<div class="grphead">Kokoro · preset voices</div>'+
   '<div class="settings"><div class="set"><label>Speed</label><div class="rng"><input type="range" min="0.5" max="1.5" step="0.05" value="1.0"><span class="v">1.0×</span></div></div></div>'+
   '<div class="muted" style="font-size:10.5px">Fixed preset voices — only speed is adjustable.</div>';
 return head+'<div class="grphead">Chatterbox · knob-driven</div>'+
   '<div class="settings"><div class="set"><label>Exaggeration</label><div class="rng"><input type="range" min="0" max="1" step="0.05" value="0.5"><span class="v">0.50</span></div></div><div class="set"><label>CFG weight</label><div class="rng"><input type="range" min="0" max="1" step="0.05" value="0.5"><span class="v">0.50</span></div></div><div class="set"><label>Temperature</label><div class="rng"><input type="range" min="0" max="1.5" step="0.05" value="0.8"><span class="v">0.80</span></div></div><div class="set"><label>Speed</label><div class="rng"><input type="range" min="0.5" max="1.5" step="0.05" value="1.0"><span class="v">1.0×</span></div></div><div class="set"><label>Repetition penalty</label><input type="number" value="1.2" step="0.05"></div><div class="set"><label>Seed</label><input type="number" placeholder="random"></div></div>';
}
function ttsLab(){return `<div class="lab">
 <div class="panel"><h3>Config</h3>
   <div class="lab-h">Sample text</div><textarea>The eastern pass was wrong, and she knew it the moment her finger traced the ridge — every line drawn from a memory she could not have had.</textarea>
   <div class="lab-h">Voice / engine</div>
   <div class="sample">🎙 <select id="ttsvoice" style="flex:1" onchange="ttsVoiceChange()"><option value="chatterbox" selected>Chatterbox ▸ Elen (cloned) — knob-driven</option><option value="qwen3">Qwen3-TTS ▸ Narrator — instruct-driven</option><option value="kokoro">Kokoro ▸ af_bella — preset voice</option></select></div>
   <div id="voicesettings"></div>
   <details class="adv"><summary>Render &amp; batch ▾</summary>
     <div class="settings" style="margin-top:6px"><div class="set"><label>Device</label><input type="text" value="auto"></div><div class="set"><label>Parallel workers</label><input type="number" value="2"></div><div class="set"><label>Compile codec</label><span class="toggle" style="background:var(--line-strong)"><i style="left:2px"></i></span></div><div class="set"><label>Sub-batching</label><span class="toggle"><i></i></span></div><div class="set"><label>Min sub-batch</label><input type="number" value="4"></div><div class="set"><label>Length ratio</label><input type="number" value="5"></div><div class="set"><label>Max items/batch</label><input type="number" value="0"></div><div class="set"><label>Batch seed</label><input type="number" placeholder="-1 random"></div></div>
     <div class="muted" style="font-size:10.5px;margin-top:4px">Max items/batch <b>0 = auto from VRAM</b>.</div></details>
   <details class="adv"><summary>Merge timing ▾</summary>
     <div class="settings" style="margin-top:6px"><div class="set"><label>Speaker-change pause (ms)</label><input type="number" value="500"></div><div class="set"><label>Same-speaker pause (ms)</label><input type="number" value="250"></div></div>
     <div class="muted" style="font-size:10.5px;margin-top:4px">Silence inserted when stitching lines on merge.</div></details>
 </div>
 <div><div class="cmp-head"><h3 style="font-family:var(--font-serif);font-size:15px;margin:0">Compare candidates</h3><span class="muted" style="font-size:12px">same text · different voice / settings</span><span class="run"><button class="btn primary sm">▶ Render all</button></span></div>
   <div class="cols">
     <div class="col win"><div class="ch"><input type="radio" name="w" checked><select><option selected>Chatterbox ▸ Elen · exaggeration 0.5</option></select><span class="tagm free">LOCAL</span></div>
       <div class="out"><div class="player"><button class="play">▶</button><div class="wave">${bars(7)}</div><span class="dur">0:09</span></div><div class="kv">exaggeration <b>0.50</b> · cfg <b>0.50</b> · temp <b>0.80</b> · speed <b>1.0×</b></div></div>
       <div class="cf"><span class="m">warm, even — matches the narration baseline</span><span style="margin-left:auto" class="m">3.1 s render</span></div></div>
     <div class="col"><div class="ch"><input type="radio" name="w"><select><option selected>Qwen3-TTS ▸ Narrator · "warm, calm"</option></select><span class="tagm free">LOCAL</span></div>
       <div class="out"><div class="player"><button class="play">▶</button><div class="wave">${bars(31)}</div><span class="dur">0:10</span></div><div class="kv">instruct: <b>warm, calm narrator</b> · speed <b>1.0×</b></div></div>
       <div class="cf"><span class="m">smoother prosody — instruct-steered, no knobs</span><span style="margin-left:auto" class="m">3.4 s render</span></div></div>
   </div>
   <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px"><div class="addcol">+ Add a voice / settings column</div><div></div></div>
 </div></div>

function wireRng(){document.querySelectorAll('.set .rng input').forEach(r=>{const v=r.parentElement.querySelector('.v');if(!v)return;const u=v.textContent.includes('×')?'×':'';r.oninput=()=>v.textContent=parseFloat(r.value).toFixed(u?1:2)+u;});}
