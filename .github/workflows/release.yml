# SPDX-License-Identifier: MIT
name: Release

on:
  push:
    tags:
      - "v*"

# No concurrency group — release builds must never cancel each other.

permissions:
  contents: write # needed to create / update the GitHub release

# The desktop app is Electron + the Node server (the family's move, 2026-10-08); electron-builder
# makes the installers (package.json `build`). A packaged app also carries the audio.cpp DSP
# program: Quasar's beforeBuild stages it from the pinned audio.cpp release
# (scripts/audiocpp-dsp-package.js — sha256-checked, macOS lipo'd from both Metal builds).
jobs:
  build:
    name: Installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: win32
          - platform: macos-latest
            target: darwin
          - platform: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.platform }}
    steps:
      # The app needs the family kit and the sync engine beside it (server/package.json:
      # file:../../just-core/packages/core and file:../../just-sqlite-sync; quasar.config.js:
      # ../just-core/packages/ui), so all three are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: JustVioce
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-core
          path: just-core
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-sqlite-sync
          path: just-sqlite-sync

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            JustVioce/package-lock.json
            JustVioce/src-electron/package-lock.json
            just-core/packages/core/package-lock.json
            just-sqlite-sync/package-lock.json

      # better-sqlite3 and koffi ship per-platform N-API prebuilds, so nothing native is
      # compiled here; electron-builder (Quasar's Electron mode, quasar.config.js) packages the
      # Electron src-electron/package.json pins.
      - name: Install the kit's server deps
        working-directory: just-core/packages/core
        run: npm ci
      - name: Install the sync engine's deps
        working-directory: just-sqlite-sync
        run: npm ci --omit=dev
      - name: Install deps
        working-directory: JustVioce
        run: npm ci
      - name: Install the desktop app's deps (Electron, which the server's scripts run as Node)
        working-directory: JustVioce/src-electron
        run: npm ci

      # Signing: electron-builder signs when its variables are set and builds unsigned (with a
      # warning in its log) when they are not. macOS: the p12 (base64) and its password, plus
      # the Apple ID trio for notarization. Windows: the code-signing PFX (base64) and password.
      - name: Build the installers
        working-directory: JustVioce
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        # Quasar's CLI run as node (app-structure §Q.6); -P never: publishing is the next step's job
        run: node node_modules/@quasar/app-vite/bin/quasar.js build -m electron -T ${{ matrix.target }} -P never

      # The packaged app started as a user starts it, on a fresh data folder: it must load its window
      # and answer on its port with its own version before anything is attached (the macOS and Linux
      # builds are never opened by hand). Linux needs a display (Xvfb) for the window. The template's
      # three checks (scripts/start-packaged.js; decided 2026-10-20).
      - name: Start the packaged app
        working-directory: JustVioce
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
            xvfb-run -a node scripts/start-packaged.js
          else
            node scripts/start-packaged.js
          fi

      # The server on its own through justvoice-server, as the help tells a user to start it: no window
      # and no display — it must answer with its version and serve the app's page.
      - name: Start the server on its own
        working-directory: JustVioce
        shell: bash
        run: node scripts/start-packaged.js --headless

      # No data folder named: the window and the server on its own use the app's default — one folder.
      - name: The window and the server on its own share one data folder
        working-directory: JustVioce
        shell: bash
        run: |
          window="node"
          if [ "${{ matrix.target }}" = linux ]; then window="xvfb-run -a node"; fi
          # each run's lines shown and kept in a file (Git Bash on Windows has no /dev/stderr to tee to)
          $window scripts/start-packaged.js --default-data | tee window.log
          node scripts/start-packaged.js --headless --default-data | tee headless.log
          a=$(sed -n 's/^data folder used: //p' window.log)
          b=$(sed -n 's/^data folder used: //p' headless.log)
          echo "the window: $a"; echo "on its own: $b"
          test -n "$a" && test "$a" = "$b"

      # the AppImage for the Linux user's check below
      - name: Keep the AppImage for the Linux user's check
        if: ${{ matrix.target == 'linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: JustVioce/dist/electron/Packaged/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Publish to the draft release
        working-directory: JustVioce
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft $PRE \
            --title "JustVoice $TAG" \
            --notes "See the assets below to download and install this version." \
            || gh release view "$TAG" >/dev/null  # another platform's job created it first
          shopt -s nullglob
          # the updater's feed (latest*.yml) and the blockmaps its downloads are checked against go up
          # with the installers
          gh release upload "$TAG" dist/electron/Packaged/*.exe dist/electron/Packaged/*.dmg dist/electron/Packaged/*.AppImage dist/electron/Packaged/*.deb dist/electron/Packaged/latest*.yml dist/electron/Packaged/*.blockmap --clobber

  # The AppImage opened the way a Linux user opens it — the file itself, no flags — on the current
  # Ubuntu LTS, which installs no FUSE 2 and whose AppArmor keeps unprivileged programs out of user
  # namespaces (Chromium's sandbox needs them): the build's own check runs the unpacked folder with
  # --no-sandbox, this one doesn't. It proves the static AppImage runtime (quasar.config.js
  # `toolsets.appimage`). The release is a draft until it is published by hand: a failure here is
  # seen before that (the template's linux-user job; decided 2026-10-20).
  linux-user:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: JustVioce
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The Linux build
        uses: actions/download-artifact@v4
        with:
          name: appimage
          path: JustVioce/dist/electron/Packaged

      - name: Open the AppImage as a user does
        working-directory: JustVioce
        shell: bash
        run: |
          echo "user namespaces restricted: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          echo "libfuse.so.2: $(ldconfig -p | grep -c 'libfuse.so.2') found"
          chmod +x dist/electron/Packaged/*.AppImage
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a node scripts/start-packaged.js --appimage

      - name: Start the AppImage's server on its own
        working-directory: JustVioce
        shell: bash
        run: node scripts/start-packaged.js --appimage --headless

      - name: The AppImage and its server on its own share one data folder
        working-directory: JustVioce
        shell: bash
        run: |
          xvfb-run -a node scripts/start-packaged.js --appimage --default-data | tee window.log
          node scripts/start-packaged.js --appimage --headless --default-data | tee headless.log
          a=$(sed -n 's/^data folder used: //p' window.log)
          b=$(sed -n 's/^data folder used: //p' headless.log)
          echo "the AppImage: $a"; echo "on its own: $b"
          test -n "$a" && test "$a" = "$b"
