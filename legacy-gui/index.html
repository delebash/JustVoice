      <!-- ─── Compare ─── -->
      <template v-if="view === 'compare'">
        <section class="block stack">
          <h3>Two WAVs in, side-by-side report out</h3>
          <p class="endnote" style="margin-bottom: 12px;">
            Drop two 16-bit PCM WAV files. JustVoice reports format match, peak/RMS loudness diff, sample-level RMSE if formats line up, and a coarse verdict (<span class="mono">identical</span> / <span class="mono">near-identical</span> / <span class="mono">similar</span> / <span class="mono">different</span> / <span class="mono">unrelated</span>). Use this to compare two TTS pipelines' output of the same text + voice.
          </p>
          <div class="grid-2">
            <div>
              <label>A (baseline) — label (optional)</label>
              <input type="text" v-model="compareLabelA" placeholder="e.g. JustVoice Kokoro" />
              <div style="margin-top: 10px;">
                <label>WAV file A</label>
                <input type="file" accept="audio/wav,audio/x-wav,.wav" @change="compareFileA = $event.target.files[0]" />
              </div>
            </div>
            <div>
              <label>B (compared against A) — label (optional)</label>
              <input type="text" v-model="compareLabelB" placeholder="e.g. Local Kokoro FastAPI" />
              <div style="margin-top: 10px;">
                <label>WAV file B</label>
                <input type="file" accept="audio/wav,audio/x-wav,.wav" @change="compareFileB = $event.target.files[0]" />
              </div>
            </div>
          </div>
          <div class="row">
            <button class="primary" @click="runCompare" :disabled="compareBusy || !compareFileA || !compareFileB">
              {{ compareBusy ? 'Analyzing…' : 'Compare' }}
            </button>
            <span class="endnote">POST /v1/compare</span>
          </div>
        </section>

        <section class="block" v-if="compareReport">
          <h3>
            Verdict: <span class="tag" :data-verdict="compareReport.verdict">{{ compareReport.verdict }}</span>
          </h3>
          <table style="margin-top: 14px;">
            <thead>
              <tr>
                <th>Metric</th>
                <th>{{ compareReport.a_label || 'A' }}</th>
                <th>{{ compareReport.b_label || 'B' }}</th>
                <th>Δ (B − A)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>SHA-256</td>
                <td><span class="mono" style="font-size: 11px;">{{ compareReport.a.sha256.slice(0, 16) }}…</span></td>
                <td><span class="mono" style="font-size: 11px;">{{ compareReport.b.sha256.slice(0, 16) }}…</span></td>
                <td>{{ compareReport.identical ? 'identical' : 'differ' }}</td>
              </tr>
              <tr>
                <td>File size</td>
                <td>{{ (compareReport.a.file_size_bytes / 1024).toFixed(1) }} KB</td>
                <td>{{ (compareReport.b.file_size_bytes / 1024).toFixed(1) }} KB</td>
                <td>{{ ((compareReport.b.file_size_bytes - compareReport.a.file_size_bytes) / 1024).toFixed(1) }} KB</td>
              </tr>
              <tr>
                <td>Sample rate</td>
                <td>{{ compareReport.a.format.sample_rate }} Hz</td>
                <td>{{ compareReport.b.format.sample_rate }} Hz</td>
                <td>{{ compareReport.format_match ? '—' : 'mismatch' }}</td>
              </tr>
              <tr>
                <td>Channels</td>
                <td>{{ compareReport.a.format.channels }}</td>
                <td>{{ compareReport.b.format.channels }}</td>
                <td>{{ compareReport.a.format.channels === compareReport.b.format.channels ? '—' : 'mismatch' }}</td>
              </tr>
              <tr>
                <td>Duration</td>
                <td>{{ compareReport.a.format.duration_sec.toFixed(3) }}s</td>
                <td>{{ compareReport.b.format.duration_sec.toFixed(3) }}s</td>
                <td>{{ (compareReport.duration_diff_sec >= 0 ? '+' : '') + compareReport.duration_diff_sec.toFixed(3) }}s</td>
              </tr>
              <tr>
                <td>Peak loudness</td>
                <td>{{ fmtDb(compareReport.a.loudness.peak_dbfs) }}</td>
                <td>{{ fmtDb(compareReport.b.loudness.peak_dbfs) }}</td>
                <td>{{ fmtDb(compareReport.peak_diff_db) }}</td>
              </tr>
              <tr>
                <td>RMS loudness</td>
                <td>{{ fmtDb(compareReport.a.loudness.rms_dbfs) }}</td>
                <td>{{ fmtDb(compareReport.b.loudness.rms_dbfs) }}</td>
                <td>{{ fmtDb(compareReport.rms_diff_db) }}</td>
              </tr>
              <tr>
                <td>Crest factor (peak − RMS)</td>
                <td>{{ fmtDb(compareReport.a.loudness.crest_factor_db) }}</td>
                <td>{{ fmtDb(compareReport.b.loudness.crest_factor_db) }}</td>
                <td>—</td>
              </tr>
              <tr>
                <td>Silence ratio</td>
                <td>{{ (compareReport.a.loudness.silence_ratio * 100).toFixed(1) }}%</td>
                <td>{{ (compareReport.b.loudness.silence_ratio * 100).toFixed(1) }}%</td>
                <td>—</td>
              </tr>
              <tr>
                <td>Clipping ratio</td>
                <td>{{ (compareReport.a.loudness.clipping_ratio * 100).toFixed(3) }}%</td>
                <td>{{ (compareReport.b.loudness.clipping_ratio * 100).toFixed(3) }}%</td>
                <td>—</td>
              </tr>
              <tr v-if="compareReport.sample_rmse !== null">
                <td>Sample-level RMSE</td>
                <td colspan="2">{{ compareReport.sample_rmse.toFixed(5) }} (normalized to [-1, 1])</td>
                <td>—</td>
              </tr>
              <tr v-if="compareReport.max_sample_delta !== null">
                <td>Max sample Δ</td>
                <td colspan="2">{{ compareReport.max_sample_delta.toFixed(5) }}</td>
                <td>—</td>
              </tr>
              <tr v-if="compareReport.pct_identical_samples !== null">
                <td>% identical samples</td>
                <td colspan="2">{{ (compareReport.pct_identical_samples * 100).toFixed(3) }}%</td>
                <td>—</td>
              </tr>
            </tbody>
          </table>
          <p class="endnote" style="margin-top: 16px;">
            <strong>How to read it.</strong>
            <span v-if="compareReport.identical">Bit-identical — the two files are the same bytes. The pipelines produced identical output (rare; suggests deterministic sampling + same model + same seed).</span>
            <span v-else-if="!compareReport.format_match">Formats differ — comparing sample-by-sample isn't meaningful until you resample one to match the other. The duration / loudness deltas are still useful.</span>
            <span v-else>Same format but different bytes. Sample RMSE near zero = perceptually near-identical (different floating-point paths can produce tiny diffs). RMSE 0.01-0.05 = similar quality but different model state. RMSE &gt; 0.1 = audibly different output.</span>
          </p>
        </section>
      </template>

      <!-- ─── Train ─── -->
      <template v-if="view === 'train'">
        <section class="block stack">
          <h3>Queue a fine-tune</h3>
          <div class="grid-2">
            <div>
              <label>Voice name</label>
              <input v-model="trainName" placeholder="Sarah-trained" />
            </div>
            <div>
              <label>Engine</label>
              <select v-model="trainEngine">
                <option value="">Pick an engine…</option>
                <option v-for="e in enginesList" :key="e.id" :value="e.id">{{ e.name }}</option>
              </select>
            </div>
            <div>
              <label>Base voice (optional)</label>
              <select v-model="trainBaseVoice">
                <option value="">— none —</option>
                <option v-for="v in voices" :key="v.id" :value="v.id">{{ v.name }} ({{ v.engine }})</option>
              </select>
            </div>
            <div>
              <label>Epochs (optional override)</label>
              <input type="number" v-model="trainEpochs" placeholder="engine default" />
            </div>
            <div>
              <label>Learning rate (optional override)</label>
              <input type="number" step="0.00001" v-model="trainLearningRate" placeholder="engine default" />
            </div>
          </div>
          <div>
            <label>Add reference samples (WAV + spoken transcript per sample)</label>
            <input type="file" accept="audio/*" multiple @change="addTrainFile" />
            <div v-if="trainFiles.length" style="margin-top: 10px;">
              <table>
                <thead><tr><th>File</th><th>Transcript</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="(s, idx) in trainFiles" :key="idx">
                    <td class="mono">{{ s.file.name }}</td>
                    <td><input v-model="s.transcript" placeholder="What the speaker says in this clip" /></td>
                    <td><button class="bare" @click="removeTrainFile(idx)">Remove</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p class="endnote" style="margin-top: 8px;">
              5-30 min total works best. Transcripts strongly recommended (engines that accept them train faster). Server runs pre-flight QC — bad SNR / clipped / too-silent samples are rejected before training kicks off.
            </p>
          </div>
          <div class="row">
            <button class="primary" @click="submitTrain" :disabled="trainBusy || !trainEngine || !trainName || !trainFiles.length">
              {{ trainBusy ? 'Queueing…' : 'Queue training job' }}
            </button>
            <span class="endnote">POST /v1/train &rarr; returns 202 with job_id. Engine must have <span class="mono">supports_training</span> = true.</span>
          </div>
        </section>

        <section class="block">
          <div class="row">
            <h3 style="margin: 0;">{{ trainJobs.length }} training jobs</h3>
            <button class="bare" @click="refreshTrainJobs">Refresh</button>
          </div>
          <table v-if="trainJobs.length">
            <thead>
              <tr>
                <th>Job</th>
                <th>Engine</th>
                <th>Voice</th>
                <th>Phase</th>
                <th>Progress</th>
                <th>Final loss</th>
                <th>Voice id</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="j in trainJobs" :key="j.job_id">
                <td><span class="mono">{{ j.job_id }}</span></td>
                <td><span class="tag">{{ j.engine }}</span></td>
                <td>{{ j.voice_name }}</td>
                <td>{{ j.phase }}<span v-if="j.error" class="endnote"> — {{ j.error }}</span></td>
                <td>{{ Math.round((j.progress || 0) * 100) }}%</td>
                <td>{{ j.loss_curve && j.loss_curve.length ? j.loss_curve[j.loss_curve.length-1].toFixed(3) : '—' }}</td>
                <td><span class="mono">{{ j.final_voice_id || '—' }}</span></td>
                <td>
                  <button v-if="['queued','validating','preparing','running'].includes(j.phase)" class="bare" @click="cancelTrainJob(j.job_id)">Cancel</button>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">No training jobs.</div>
        </section>
      </template>

      <!-- ─── Personas ─── -->
      <template v-if="view === 'personas'">
        <section class="block stack">
          <h3>Bind a new persona</h3>
          <div class="grid-2">
            <div>
              <label>Name</label>
              <input v-model="personaName" placeholder="Sarah, Mr Holmes, the narrator…" />
            </div>
            <div>
              <label>Voice</label>
              <select v-model="personaVoice">
                <option v-for="v in voices" :key="v.id" :value="v.id">{{ v.name }} — {{ v.id }}</option>
              </select>
            </div>
          </div>
          <div>
            <button class="primary" @click="createPersona">Bind persona</button>
          </div>
        </section>

        <section class="block">
          <h3>{{ personas.length }} bound</h3>
          <table v-if="personas.length">
            <thead>
              <tr>
                <th>Name</th>
                <th>Voice</th>
                <th>Bound</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="p in personas" :key="p.id">
                <td><span class="em">{{ p.name }}</span></td>
                <td><span class="mono">{{ p.voice_id }}</span></td>
                <td>{{ fmtDate(p.created_at) }}</td>
                <td>
                  <button class="bare" @click="deletePersona(p.id)">Release</button>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">No personas bound.</div>
        </section>
      </template>

      <!-- ─── Lexicons ─── -->
      <template v-if="view === 'lexicons'">
        <section class="block stack">
          <h3>New lexicon</h3>
          <div class="row">
            <input v-model="lexNewName" placeholder="e.g. book-1-character-names" style="flex: 1;" />
            <button class="primary" @click="createLexicon">Create lexicon</button>
          </div>
          <p class="endnote">
            Per-render pronunciation dictionary. Apply to <span class="mono" style="font-size: 11px;">/v1/generate</span> via <span class="mono" style="font-size: 11px;">lexicons: [&quot;lex_id&quot;]</span>. Engine matches grapheme strings and uses your IPA / alias instead of its default pronunciation.
          </p>
        </section>

        <section class="block" v-if="lexicons.length">
          <h3>{{ lexicons.length }} lexicons</h3>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Entries</th>
                <th>ID</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="lx in lexicons" :key="lx.id" @click="lexSelectedId = lx.id" style="cursor: pointer;" :class="{ active: lexSelectedId === lx.id }">
                <td><span class="em">{{ lx.name }}</span></td>
                <td>{{ (lx.entries || []).length }}</td>
                <td><span class="mono">{{ lx.id }}</span></td>
                <td style="text-align: right;">
                  <button class="bare" @click.stop="deleteLexicon(lx.id)">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
        <div v-else class="empty">No lexicons yet.</div>

        <section class="block stack" v-if="selectedLexicon">
          <h3>{{ selectedLexicon.name }} — entries</h3>
          <table v-if="(selectedLexicon.entries || []).length">
            <thead><tr><th>Grapheme</th><th>IPA</th><th>Alias</th></tr></thead>
            <tbody>
              <tr v-for="(e, i) in selectedLexicon.entries" :key="i">
                <td><span class="em">{{ e.grapheme }}</span></td>
                <td><span class="mono">{{ e.phoneme_ipa || '—' }}</span></td>
                <td>{{ e.alias || '—' }}</td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty" style="padding: 16px 0;">No entries in this lexicon yet.</div>

          <h3 style="margin-top: 24px;">Append entry</h3>
          <div class="grid-2">
            <div>
              <label>Grapheme (word as it appears)</label>
              <input v-model="lexNewGrapheme" placeholder="Aelindor" />
            </div>
            <div>
              <label>Phoneme IPA (preferred)</label>
              <input v-model="lexNewPhoneme" placeholder="ˈeɪ.lɪn.dɔːr" />
            </div>
          </div>
          <div>
            <label>Alias (alternative — engine reads this instead of grapheme)</label>
            <input v-model="lexNewAlias" placeholder="ay-lin-door" />
          </div>
          <div>
            <button class="primary" @click="appendLexEntry">Append entry</button>
            <span class="endnote" style="margin-left: 14px;">Provide IPA OR alias OR both. Engine prefers IPA where supported.</span>
          </div>
        </section>
      </template>

      <!-- ─── Engines ─── -->
      <template v-if="view === 'engines'">
        <section class="block" v-if="systemInfo">
          <h3>This machine</h3>
          <div class="stats">
            <div class="stat">
              <div class="k">OS / Arch</div>
              <div class="v" style="font-size: 28px;">{{ systemInfo.os.family }}<span class="unit">{{ systemInfo.os.arch }}</span></div>
              <div class="x">{{ systemInfo.os.version }}</div>
            </div>
            <div class="stat">
              <div class="k">CPU</div>
              <div class="v" style="font-size: 28px;">{{ systemInfo.cpu.cores_logical }}<span class="unit">threads</span></div>
              <div class="x">{{ systemInfo.cpu.brand }}</div>
            </div>
            <div class="stat">
              <div class="k">Memory</div>
              <div class="v">{{ Math.round(systemInfo.memory.total_mb / 1024) }}<span class="unit">GB</span></div>
              <div class="x">{{ Math.round(systemInfo.memory.available_mb / 1024) }} GB available</div>
            </div>
          </div>

          <div v-if="systemInfo.gpus && systemInfo.gpus.length" style="margin-top: 24px;">
            <h3>GPU{{ systemInfo.gpus.length > 1 ? 's' : '' }}</h3>
            <table>
              <thead><tr><th>Vendor</th><th>Model</th><th>VRAM</th><th>Driver</th></tr></thead>
              <tbody>
                <tr v-for="(g, i) in systemInfo.gpus" :key="i">
                  <td><span class="tag">{{ g.vendor }}</span></td>
                  <td><span class="em">{{ g.model }}</span></td>
                  <td>{{ g.vram_mb ? (g.vram_mb / 1024).toFixed(1) + ' GB' : '—' }}</td>
                  <td><span class="mono">{{ g.driver_version || '—' }}</span></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div style="margin-top: 24px;">
            <h3>Acceleration runtimes</h3>
            <div class="row" style="flex-wrap: wrap; gap: 8px;">
              <span v-if="systemInfo.runtimes.cuda" class="tag">CUDA {{ systemInfo.runtimes.cuda.version }}</span>
              <span v-if="systemInfo.runtimes.metal" class="tag">Metal</span>
              <span v-if="systemInfo.runtimes.coreml" class="tag">CoreML</span>
              <span v-if="systemInfo.runtimes.directml" class="tag">DirectML</span>
              <span v-if="systemInfo.runtimes.rocm" class="tag">ROCm {{ systemInfo.runtimes.rocm.version }}</span>
              <span v-if="systemInfo.runtimes.vulkan" class="tag">Vulkan</span>
              <span class="tag">CPU</span>
            </div>
          </div>
        </section>

        <section class="block" v-if="enginesList.length">
          <h3>{{ enginesList.length }} engines</h3>
          <table>
            <thead>
              <tr>
                <th>Engine</th>
                <th>Backend</th>
                <th>Status</th>
                <th>Disk</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template v-for="e in enginesList" :key="e.id">
                <tr>
                  <td>
                    <span class="em">{{ e.name }}</span>
                    <span v-if="e.is_stubbed" class="tag" style="margin-left: 8px;">stub mode</span>
                  </td>
                  <td><span class="mono">{{ e.backend }}</span></td>
                  <td>
                    <span class="status" :class="{ ok: e.status === 'loaded' || e.status === 'installed', warn: e.status === 'installing' || e.status === 'loading' }">
                      <span class="sq"></span>{{ e.status.replace('_', ' ') }}
                    </span>
                  </td>
                  <td>{{ e.prerequisites.disk_space_mb >= 1024 ? (e.prerequisites.disk_space_mb / 1024).toFixed(1) + ' GB' : e.prerequisites.disk_space_mb + ' MB' }}</td>
                  <td style="text-align: right;">
                    <button v-if="e.status === 'not_installed'" class="primary" :disabled="engineBusy[e.id]" @click="installEngine(e.id, null)">
                      {{ engineBusy[e.id] === 'install' ? 'Installing…' : 'Install' }}
                    </button>
                    <button v-else-if="e.status === 'installed'" class="primary" :disabled="engineBusy[e.id]" @click="loadEngine(e.id)">
                      {{ engineBusy[e.id] === 'load' ? 'Loading…' : 'Load' }}
                    </button>
                    <button v-else-if="e.status === 'loaded'" class="bare" :disabled="engineBusy._global" @click="unloadEngine()">
                      {{ engineBusy._global === 'unload' ? 'Unloading…' : 'Unload' }}
                    </button>
                    <button v-if="e.status !== 'not_installed'" class="bare" :disabled="engineBusy[e.id]" @click="uninstallEngine(e.id)" style="margin-left: 10px; color: var(--danger, #b00020);">
                      {{ engineBusy[e.id] === 'uninstall' ? 'Uninstalling…' : 'Uninstall' }}
                    </button>
                  </td>
                </tr>
                <tr v-if="engineProgress[e.id]" :key="e.id + '-progress'">
                  <td colspan="5" class="progress-cell">
                    <div class="progress-row">
                      <span class="progress-phase">{{ engineProgress[e.id].phase }}</span>
                      <div class="progress-track">
                        <div class="progress-bar" :class="'phase-' + engineProgress[e.id].phase" :style="progressBarStyle(engineProgress[e.id])"></div>
                      </div>
                      <span class="progress-bytes">
                        <template v-if="engineProgress[e.id].bytes_total > 0">
                          {{ (engineProgress[e.id].bytes_downloaded / 1024 / 1024).toFixed(1) }} / {{ (engineProgress[e.id].bytes_total / 1024 / 1024).toFixed(1) }} MB
                        </template>
                        <template v-else>—</template>
                      </span>
                    </div>
                    <div v-if="engineProgress[e.id].current_file" class="endnote progress-file">
                      <span class="mono">{{ engineProgress[e.id].current_file }}</span>
                    </div>
                    <div v-if="engineProgress[e.id].error" class="endnote progress-error">
                      <strong>Install failed.</strong> {{ engineProgress[e.id].error }}
                      <button class="bare" style="margin-left: 12px;" @click="dismissEngineProgress(e.id)">Dismiss</button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <p class="endnote" style="margin-top: 14px;">
            Engines load one at a time. Loading a new engine unloads the previous one to free GPU memory. The "stub mode" tag means the engine is registered but its model files aren't downloaded — install to hear real audio.
          </p>
        </section>

        <section class="block" v-for="e in enginesList" :key="'detail-' + e.id">
          <h3>{{ e.name }} — details</h3>
          <p class="endnote" style="margin-bottom: 14px; line-height: 1.6;">{{ e.description }}</p>
          <div class="row" style="flex-wrap: wrap; gap: 6px; margin-bottom: 12px;">
            <span v-for="cap in e.capabilities" :key="cap" class="tag">{{ cap.replace('_', ' ') }}</span>
          </div>
          <p class="endnote">
            GPU runtimes:
            <span v-if="!e.prerequisites.gpu_runtimes.length">CPU only</span>
            <span v-for="r in e.prerequisites.gpu_runtimes" :key="r" class="mono" style="margin: 0 4px;">{{ r }}</span>
          </p>
          <button v-if="!engineModels[e.id]" @click="loadEngineModels(e.id)" style="margin-top: 10px;">Show model variants</button>
          <div v-if="engineModels[e.id]" style="margin-top: 16px;">
            <table>
              <thead><tr><th>Variant</th><th>Size</th><th>VRAM</th><th>Quality</th><th></th></tr></thead>
              <tbody>
                <tr v-for="v in engineModels[e.id].variants" :key="v.id">
                  <td>
                    <span class="em">{{ v.name }}</span>
                    <span v-if="engineModels[e.id].recommended.best_fit && engineModels[e.id].recommended.best_fit.id === v.id" class="tag" style="margin-left: 8px;">recommended</span>
                    <span v-if="(engineModels[e.id].recommended.would_oom || []).includes(v.id)" class="tag" style="background: var(--danger-soft); color: var(--danger); margin-left: 8px;">won't fit</span>
                  </td>
                  <td>{{ v.size_mb >= 1024 ? (v.size_mb / 1024).toFixed(1) + ' GB' : v.size_mb + ' MB' }}</td>
                  <td>{{ v.vram_mb ? (v.vram_mb / 1024).toFixed(1) + ' GB' : 'CPU' }}</td>
                  <td>{{ v.quality }}/100</td>
                  <td style="text-align: right;">
                    <button class="primary" :disabled="engineBusy[e.id] || (engineModels[e.id].recommended.would_oom || []).includes(v.id)" @click="installEngine(e.id, v.id)">Install</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </template>

      <!-- ─── Cache ─── -->
      <template v-if="view === 'cache'">
        <section class="block" v-if="cacheStats">
          <h3>Total on disk</h3>
          <div class="stats">
            <div class="stat">
              <div class="k">Entries</div>
              <div class="v">{{ cacheStats.total_entries_on_disk }}</div>
              <div class="x">held across all scopes</div>
            </div>
            <div class="stat">
              <div class="k">Disk used</div>
              <div class="v">{{ fmtMB(cacheStats.total_bytes_on_disk) }}<span class="unit">MB</span></div>
              <div class="x">across scopes</div>
            </div>
            <div class="stat" style="display:flex; align-items:flex-end;">
              <button class="danger" @click="clearCache()">Purge all scopes</button>
            </div>
          </div>
        </section>

        <section class="block" v-if="cacheStats && Object.keys(cacheStats.scopes || {}).length">
          <h3>By scope</h3>
          <table>
            <thead>
              <tr>
                <th>Scope</th>
                <th>Entries</th>
                <th>Disk · MB</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(stats, scope) in cacheStats.scopes" :key="scope">
                <td><span class="em">{{ scope }}</span></td>
                <td>{{ stats.entries_on_disk }}</td>
                <td>{{ fmtMB(stats.bytes_on_disk) }}</td>
                <td>
                  <button class="bare" @click="clearCache(scope)">Purge</button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </template>

      <!-- ─── Settings ─── -->
      <template v-if="view === 'settings'">
        <section class="block" v-if="settings">
          <h3>Cache</h3>
          <div class="grid-2">
            <div>
              <label>Max memory entries</label>
              <input type="number" v-model.number="settings.cache.max_memory_entries" />
            </div>
            <div>
              <label>Max disk bytes per scope</label>
              <input type="number" v-model.number="settings.cache.max_disk_bytes_per_scope" />
            </div>
          </div>
          <div style="margin-top: 22px;">
            <label class="row" style="cursor: pointer; gap: 10px; margin: 0; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 400; color: var(--ink);">
              <input type="checkbox" v-model="settings.cache.enabled" style="width: 16px; height: 16px; padding: 0; cursor: pointer;" />
              <span>Cache enabled</span>
            </label>
          </div>
        </section>

        <section class="block" v-if="settings">
          <h3>Limits</h3>
          <div class="grid-2">
            <div>
              <label>Text — max chars</label>
              <input type="number" v-model.number="settings.limits.text_max_chars" />
            </div>
            <div>
              <label>Chapter — max lines</label>
              <input type="number" v-model.number="settings.limits.chapter_max_lines" />
            </div>
            <div>
              <label>Reference clip — max bytes</label>
              <input type="number" v-model.number="settings.limits.reference_clip_max_bytes" />
            </div>
            <div>
              <label>Request body — max bytes</label>
              <input type="number" v-model.number="settings.limits.request_body_max_bytes" />
            </div>
          </div>
        </section>

        <section class="block" v-if="settings && settings.training">
          <h3>Training (Phase 5)</h3>
          <div class="grid-2">
            <div>
              <label>Max concurrent jobs</label>
              <input type="number" v-model.number="settings.training.max_concurrent_jobs" />
            </div>
            <div>
              <label>Max samples per job</label>
              <input type="number" v-model.number="settings.training.max_samples_per_job" />
            </div>
            <div>
              <label>Sample loss every (steps)</label>
              <input type="number" v-model.number="settings.training.sample_loss_every" />
            </div>
            <div>
              <label>Default voice language (BCP-47)</label>
              <input type="text" v-model="settings.training.default_voice_language" />
            </div>
          </div>
          <div style="margin-top: 14px;">
            <label class="row" style="cursor: pointer; gap: 10px; margin: 0; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 400; color: var(--ink);">
              <input type="checkbox" v-model="settings.training.enabled" style="width: 16px; height: 16px; padding: 0; cursor: pointer;" />
              <span>Training enabled (master gate — off makes POST /v1/train return 501)</span>
            </label>
          </div>
          <h3 style="margin-top: 22px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;">Validation thresholds</h3>
          <div class="grid-2">
            <div>
              <label>Min sample duration (s)</label>
              <input type="number" step="0.1" v-model.number="settings.training.validation.min_sample_duration_secs" />
            </div>
            <div>
              <label>Max sample duration (s)</label>
              <input type="number" step="0.1" v-model.number="settings.training.validation.max_sample_duration_secs" />
            </div>
            <div>
              <label>Min SNR (dB)</label>
              <input type="number" step="0.5" v-model.number="settings.training.validation.min_snr_db" />
            </div>
            <div>
              <label>Max silence ratio</label>
              <input type="number" step="0.05" v-model.number="settings.training.validation.max_silence_ratio" />
            </div>
            <div>
              <label>Min accepted samples</label>
              <input type="number" v-model.number="settings.training.validation.min_accepted_samples" />
            </div>
          </div>
        </section>

        <section class="block" v-if="settings && settings.engines">
          <h3>Local model paths</h3>
          <p class="endnote" style="margin-bottom: 14px;">
            Point JustVoice's <strong>built-in sherpa-onnx Kokoro</strong> at an existing local Kokoro model directory instead of downloading. The path should contain <span class="mono">model.onnx</span> + <span class="mono">voices.bin</span> + <span class="mono">tokens.txt</span> (flat or one directory deep). Restart required after changing.
          </p>
          <div class="grid-2">
            <div style="grid-column: 1 / -1;">
              <label>Kokoro model directory (absolute path)</label>
              <input type="text" v-model="settings.engines.kokoro.model_dir_override" spellcheck="false" placeholder="e.g. C:\Users\you\kokoro-multi-lang-v1_0" />
            </div>
          </div>
        </section>

        <section class="block" v-if="settings && settings.engines">
          <h3>External TTS servers (OpenAI-compatible)</h3>
          <p class="endnote" style="margin-bottom: 14px;">
            Register an external server that implements the OpenAI TTS API (<span class="mono">POST /v1/audio/speech</span>) as a JustVoice engine. Compatible with kokoro-fastapi, openai-edge-tts, OpenAI itself, or any custom server. Each becomes a separate engine in the catalog so you can A/B compare backends side by side. Restart required after add/remove.
          </p>
          <table v-if="settings.engines.external && settings.engines.external.length">
            <thead>
              <tr>
                <th>id</th>
                <th>name</th>
                <th>base_url</th>
                <th>model</th>
                <th>voices</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(ext, idx) in settings.engines.external" :key="idx">
                <td><span class="mono">{{ ext.id }}</span></td>
                <td><input type="text" v-model="ext.name" /></td>
                <td><input type="text" v-model="ext.base_url" spellcheck="false" /></td>
                <td><input type="text" v-model="ext.model" /></td>
                <td>
                  <input type="text" :value="(ext.voices || []).join(', ')" @change="ext.voices = $event.target.value.split(',').map(s => s.trim()).filter(Boolean)" placeholder="comma-separated" />
                </td>
                <td><button class="bare" @click="removeExternalEngine(idx)" style="color: var(--danger, #b00020);">Remove</button></td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">No external engines configured.</div>
          <div style="margin-top: 14px;">
            <h4 style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 10px;">Add a new external server</h4>
            <div class="grid-2">
              <div style="grid-column: 1 / -1;">
                <label>base URL</label>
                <input type="text" v-model="newExternal.base_url" placeholder="http://127.0.0.1:8880" spellcheck="false" />
              </div>
              <div style="grid-column: 1 / -1;">
                <label>API key (optional — required for OpenAI itself)</label>
                <input type="password" v-model="newExternal.api_key" placeholder="leave blank for self-hosted servers" />
              </div>
            </div>
            <div class="row" style="margin-top: 12px;">
              <button @click="testExternalConnection" :disabled="probeBusy || !newExternal.base_url">
                {{ probeBusy ? 'Probing…' : 'Test connection' }}
              </button>
              <span class="endnote">Pings the server and lists its models + voices.</span>
            </div>

            <!-- Probe result panel -->
            <div v-if="probeResult" class="task-strip" style="margin-top: 12px; margin-bottom: 12px;" :data-status="probeResult.reachable ? 'completed' : 'failed'">
              <span class="task-spin" :data-status="probeResult.reachable ? 'completed' : 'failed'"></span>
              <span class="task-label">
                {{ probeResult.reachable ? 'Reachable' : 'Unreachable' }}
                <template v-if="probeResult.server_hint && probeResult.server_hint !== 'unknown'"> · {{ probeResult.server_hint }}</template>
              </span>
              <span v-if="probeResult.models && probeResult.models.length" class="task-stat">{{ probeResult.models.length }} models</span>
              <span v-if="probeResult.voices && probeResult.voices.length" class="task-stat">{{ probeResult.voices.length }} voices</span>
              <span v-if="probeResult.error" class="task-stat" style="color: #b00020;">{{ probeResult.error }}</span>
            </div>

            <!-- Detail fields, shown after probe (or for manual entry) -->
            <div class="grid-2" style="margin-top: 8px;">
              <div>
                <label>id (unique, prefix with <span class="mono">external-</span>)</label>
                <input type="text" v-model="newExternal.id" placeholder="external-kokoro-local" spellcheck="false" />
              </div>
              <div>
                <label>name</label>
                <input type="text" v-model="newExternal.name" placeholder="Local Kokoro FastAPI" />
              </div>
              <div>
                <label>model</label>
                <select v-if="probeAvailableModels.length" v-model="newExternal.model">
                  <option v-for="m in probeAvailableModels" :key="m" :value="m">{{ m }}</option>
                </select>
                <input v-else type="text" v-model="newExternal.model" placeholder="kokoro" />
              </div>
              <div></div>
              <div style="grid-column: 1 / -1;">
                <label>voices (comma-separated)</label>
                <input type="text" v-model="newExternal.voicesText" placeholder="af_heart, af_bella, am_michael" spellcheck="false" />
                <div v-if="probeAvailableVoices.length" style="margin-top: 6px;">
                  <span class="endnote">Discovered voices ({{ probeAvailableVoices.length }}): </span>
                  <span class="mono" style="font-size: 11px;">{{ probeAvailableVoices.join(', ') }}</span>
                </div>
              </div>
            </div>
            <div class="row" style="margin-top: 12px;">
              <button class="primary" @click="addExternalEngine" :disabled="!newExternal.id || !newExternal.base_url">Add external server</button>
            </div>
          </div>
        </section>

        <section class="block" v-if="settings && settings.models">
          <h3>Model URL overrides</h3>
          <p class="endnote" style="margin-bottom: 14px;">
            Override download URLs per variant. Useful when upstream artifacts move (k2-fsa retags releases, HF repos rename) or when you want to mirror downloads onto an internal CDN. Keyed by variant id (e.g. <span class="mono">kokoro-multi-lang-v1_0</span>). Sidecar engines don't use these — they download via the Python sidecar's HuggingFace cache.
          </p>
          <table v-if="urlOverrideKeys.length">
            <thead>
              <tr>
                <th>Variant id</th>
                <th>Override URL</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="key in urlOverrideKeys" :key="key">
                <td><span class="mono">{{ key }}</span></td>
                <td><input type="text" v-model="settings.models.url_overrides[key]" spellcheck="false" /></td>
                <td><button class="bare" @click="removeUrlOverride(key)">Remove</button></td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">No URL overrides set.</div>
          <div class="row" style="margin-top: 12px;">
            <input type="text" v-model="newOverrideVariantId" placeholder="variant id (e.g. kokoro-multi-lang-v1_0)" style="flex: 1;" />
            <input type="text" v-model="newOverrideUrl" placeholder="override URL" style="flex: 2;" />
            <button @click="addUrlOverride" :disabled="!newOverrideVariantId || !newOverrideUrl">Add override</button>
          </div>
        </section>

        <section class="block">
          <div class="row">
            <button class="primary" @click="saveSettings">Save settings</button>
            <span class="endnote">Some changes require a server restart.</span>
          </div>
        </section>
      </template>
    </main>

    <!-- ─── Voice add modal (clone / design / import / blend) ─── -->
    <div v-if="voiceModal" class="modal-backdrop" @click.self="closeVoiceModal">
      <div class="modal">
        <h3 v-if="voiceModal === 'clone'">Clone voice from reference</h3>
        <h3 v-else-if="voiceModal === 'design'">Design voice from prose</h3>
        <h3 v-else-if="voiceModal === 'import'">Import existing audio clip</h3>
        <h3 v-else-if="voiceModal === 'blend'">Blend voices via embedding interpolation</h3>

        <div class="stack" style="margin-top: 16px;">
          <div>
            <label>Voice name</label>
            <input v-if="voiceModal === 'clone'" v-model="voiceCloneName" placeholder="Sarah" />
            <input v-else-if="voiceModal === 'design'" v-model="voiceDesignName" placeholder="Mr Holmes" />
            <input v-else-if="voiceModal === 'import'" v-model="voiceImportName" placeholder="My recording" />
            <input v-else-if="voiceModal === 'blend'" v-model="blendName" placeholder="Sarah × Mr Holmes" />
          </div>

          <div v-if="voiceModal === 'clone'">
            <label>Reference audio (3-30 s WAV/MP3/M4A/FLAC)</label>
            <input type="file" accept="audio/*" @change="voiceCloneFile = $event.target.files[0]" />
            <div style="margin-top: 14px;">
              <label>Transcript of the clip (optional — improves cloning fidelity on some engines)</label>
              <textarea v-model="voiceCloneTranscript" placeholder="What's actually said in the reference clip — engines that support text-conditioned cloning use this."></textarea>
            </div>
          </div>

          <div v-else-if="voiceModal === 'design'">
            <label>Prose description</label>
            <textarea v-model="voiceDesignPrompt" placeholder='e.g. "a calm middle-aged British man, slight northern accent, narrator-warm timbre"' style="min-height: 100px;"></textarea>
            <span class="endnote">Qwen3-native via the CustomVoice design path. Other engines may approximate this from the prompt as a fallback.</span>
          </div>

          <div v-else-if="voiceModal === 'import'">
            <label>Audio clip (WAV preferred)</label>
            <input type="file" accept="audio/*" @change="voiceImportFile = $event.target.files[0]" />
            <span class="endnote">Imported clips don't get re-synthesized — they're used as-is for playback. For voice cloning use the Clone flow.</span>
          </div>

          <div v-else-if="voiceModal === 'blend'">
            <div>
              <label>Engine</label>
              <select v-model="blendEngine">
                <option value="">Pick an engine…</option>
                <option v-for="e in enginesList" :key="e.id" :value="e.id">{{ e.name }}</option>
              </select>
              <span class="endnote">All source voices must belong to this engine. Engines without <span class="mono">supports_embedding_blending</span> return 501.</span>
            </div>
            <div style="margin-top: 14px;">
              <label>Interpolation strategy</label>
              <select v-model="blendStrategy">
                <option v-for="s in BLEND_STRATEGIES" :key="s.id" :value="s.id">{{ s.label }}</option>
              </select>
            </div>
            <div style="margin-top: 14px;">
              <label>Source voices + weights</label>
              <table>
                <thead><tr><th>Voice</th><th>Weight</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="(s, idx) in blendSources" :key="idx">
                    <td>
                      <select v-model="s.voice_id">
                        <option value="">— pick —</option>
                        <option v-for="v in voices.filter(v => !blendEngine || v.engine === blendEngine)" :key="v.id" :value="v.id">{{ v.name }} ({{ v.id }})</option>
                      </select>
                    </td>
                    <td><input type="number" step="0.1" v-model="s.weight" /></td>
                    <td><button class="bare" v-if="blendSources.length > 2" @click="removeBlendSource(idx)">Remove</button></td>
                  </tr>
                </tbody>
              </table>
              <button class="bare" @click="addBlendSource">+ Add source</button>
              <p class="endnote" style="margin-top: 6px;">
                Weights normalize automatically — pass any non-negative values. Same recipe twice returns the same voice (idempotent).
              </p>
            </div>
          </div>

          <div class="row" style="margin-top: 20px;">
            <button v-if="voiceModal === 'clone'" class="primary" :disabled="voiceBusy || !voiceCloneName || !voiceCloneFile" @click="submitClone">
              {{ voiceBusy ? 'Cloning…' : 'Clone voice' }}
            </button>
            <button v-else-if="voiceModal === 'design'" class="primary" :disabled="voiceBusy || !voiceDesignName || !voiceDesignPrompt" @click="submitDesign">
              {{ voiceBusy ? 'Designing…' : 'Design voice' }}
            </button>
            <button v-else-if="voiceModal === 'import'" class="primary" :disabled="voiceBusy || !voiceImportName || !voiceImportFile" @click="submitImport">
              {{ voiceBusy ? 'Importing…' : 'Import clip' }}
            </button>
            <button v-else-if="voiceModal === 'blend'" class="primary" :disabled="voiceBusy || !blendName || !blendEngine || blendSources.filter(s => s.voice_id).length < 2" @click="submitBlend">
              {{ voiceBusy ? 'Blending…' : 'Blend voices' }}
            </button>
            <button @click="closeVoiceModal">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── Toast queue (non-blocking notifications) ─── -->
    <div class="toast-stack">
      <div v-for="t in toasts" :key="t.id" class="toast" :data-kind="t.kind" @click="dismissToast(t.id)">
        <span class="toast-dot"></span>
        <span class="toast-msg">{{ t.message }}</span>
      </div>
    </div>

    <!-- ─── Custom confirm dialog (replaces native confirm()) ─── -->
    <div v-if="confirmDialog" class="modal-backdrop" @click.self="resolveConfirm(false)">
      <div class="modal" style="max-width: 460px;">
        <h3 style="margin-top: 0;">{{ confirmDialog.title }}</h3>
        <p style="margin: 14px 0 24px; line-height: 1.55; color: var(--ink-2, #555);">
          {{ confirmDialog.message }}
        </p>
        <div class="row" style="justify-content: flex-end; gap: 10px;">
          <button @click="resolveConfirm(false)">Cancel</button>
          <button
            class="primary"
            :style="confirmDialog.confirmStyle === 'danger' ? 'background: var(--danger, #b00020); border-color: var(--danger, #b00020);' : ''"
            @click="resolveConfirm(true)">
            {{ confirmDialog.confirmLabel }}
          </button>
        </div>
      </div>
    </div>

    <!-- ─────── Colophon ─────── -->
    <footer class="colophon">
      <div>
        <label>Server endpoint</label>
        <input v-model="serverUrl" @blur="refreshAll" spellcheck="false" />
      </div>
      <div>
        <label>Bearer token</label>
        <input v-model="token" type="password" @blur="refreshAll" spellcheck="false" placeholder="optional" />
      </div>
      <div>
        <button @click="refreshAll">Reload</button>
      </div>
      <div class="imp">
        Set in Newsreader &amp; Inter.<br />
        Apache 2.0 · justtts
      </div>
    </footer>
  </div>
  `,
};

createApp(app).mount('#app');
</script>
</body>
</html>
