[package]
name = "justvoice"
version = "0.1.0"
description = "An open-source TTS server built for audiobook production, useful for any TTS workload."
authors = ["JustVoice contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
name = "justvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-http = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# ── Audio capture ─────────────────────────────────────────────────────────
cpal = "0.15"
hound = "3.5"
scopeguard = "1.2"

# ── Global hotkey monitoring ───────────────────────────────────────────────
# keytap (jamiepine/keytap, MIT): left/right modifier fidelity,
# clean Drop-based shutdown, no unsafe Sonoma dance.
keytap = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.22"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit for system audio on macOS 12.3+
screencapturekit = { version = "1", features = ["async"] }
# objc runtime for NSPasteboard clipboard write in synthetic_keys.rs
objc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
