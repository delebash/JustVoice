# SPDX-License-Identifier: MIT
name: Release

on:
  push:
    tags:
      - "v*"

# No concurrency group — release builds must never cancel each other.

permissions:
  contents: write # needed to create / update the GitHub release

# The desktop app is Electron + the Node server (the family's move, 2026-10-08); electron-builder
# makes the installers (package.json `build`). A packaged app also carries the audio.cpp DSP
# program: Quasar's beforeBuild stages it from the pinned audio.cpp release
# (scripts/audiocpp-dsp-package.js — sha256-checked, macOS lipo'd from both Metal builds).
jobs:
  build:
    name: Installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: win32
          - platform: macos-latest
            target: darwin
          - platform: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.platform }}
    steps:
      # The app needs the family kit and the sync engine beside it (server/package.json:
      # file:../../just-llm-runner/server and file:../../just-sqlite-sync; quasar.config.js:
      # ../just-llm-runner/ui), so all three are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: JustVioce
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-llm-runner
          path: just-llm-runner
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-sqlite-sync
          path: just-sqlite-sync

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            JustVioce/package-lock.json
            JustVioce/src-electron/package-lock.json
            just-llm-runner/server/package-lock.json
            just-sqlite-sync/package-lock.json

      # better-sqlite3 and koffi ship per-platform N-API prebuilds, so nothing native is
      # compiled here; electron-builder (Quasar's Electron mode, quasar.config.js) packages the
      # Electron src-electron/package.json pins.
      - name: Install the kit's server deps
        working-directory: just-llm-runner/server
        run: npm ci
      - name: Install the sync engine's deps
        working-directory: just-sqlite-sync
        run: npm ci --omit=dev
      - name: Install deps
        working-directory: JustVioce
        run: npm ci
      - name: Install the desktop app's deps (Electron, which the server's scripts run as Node)
        working-directory: JustVioce/src-electron
        run: npm ci

      # Signing: electron-builder signs when its variables are set and builds unsigned (with a
      # warning in its log) when they are not. macOS: the p12 (base64) and its password, plus
      # the Apple ID trio for notarization. Windows: the code-signing PFX (base64) and password.
      - name: Build the installers
        working-directory: JustVioce
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        # Quasar's CLI run as node (app-structure §Q.6); -P never: publishing is the next step's job
        run: node node_modules/@quasar/app-vite/bin/quasar.js build -m electron -T ${{ matrix.target }} -P never

      - name: Publish to the draft release
        working-directory: JustVioce
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft $PRE \
            --title "JustVoice $TAG" \
            --notes "See the assets below to download and install this version." \
            || gh release view "$TAG" >/dev/null  # another platform's job created it first
          shopt -s nullglob
          # the updater's feed (latest*.yml) and the blockmaps its downloads are checked against go up
          # with the installers
          gh release upload "$TAG" dist/electron/Packaged/*.exe dist/electron/Packaged/*.dmg dist/electron/Packaged/*.AppImage dist/electron/Packaged/*.deb dist/electron/Packaged/latest*.yml dist/electron/Packaged/*.blockmap --clobber
