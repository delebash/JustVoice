<title>JustVoice Redesign Mocks</title>

<style>
:root{
  --bg:#f6f5f1;--surface:#fff;--surface-2:#fbfaf7;--surface-3:#f3f1ec;
  --ink:#1a1a1a;--ink-2:#4a4a4a;--ink-3:#888;
  --line:#e3e1dc;--line-strong:#cfccc4;
  --accent-hue:166;
  --accent:oklch(0.538 0.080 var(--accent-hue));
  --accent-ink:oklch(0.446 0.068 var(--accent-hue));
  --accent-soft:oklch(0.948 0.011 var(--accent-hue));
  --accent-line:oklch(0.840 0.035 var(--accent-hue));
  --gold:oklch(0.712 0.124 82);--warn-bg:#fff8e3;--warn-ink:#8a6a1f;--warn-line:#e6cd84;
  --danger:oklch(0.517 0.137 34);--danger-bg:oklch(0.954 0.020 34);
  --danger-ink:oklch(0.409 0.109 34);--danger-line:oklch(0.840 0.050 34);
  --info:oklch(0.547 0.123 250);
  --shadow-1:0 1px 2px rgba(20,22,24,.04);--shadow-2:0 4px 12px rgba(20,22,24,.06);
  --r-card:8px;--r-control:6px;--r-pill:999px;
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1c1a;--surface:#232624;--surface-2:#1e211f;--surface-3:#2a2e2c;
  --ink:#f0eee8;--ink-2:#c5c2bb;--ink-3:#8a8780;--line:#353835;--line-strong:#4a4d49;
  --accent:oklch(0.673 0.093 var(--accent-hue));--accent-ink:oklch(0.780 0.090 var(--accent-hue));
  --accent-soft:oklch(0.300 0.032 var(--accent-hue));--accent-line:oklch(0.400 0.045 var(--accent-hue));
  --gold:oklch(0.78 0.10 82);--warn-bg:oklch(0.28 0.040 82);--warn-ink:oklch(0.84 0.090 82);
  --warn-line:oklch(0.42 0.060 82);
  --danger:oklch(0.640 0.130 34);--danger-bg:oklch(0.290 0.045 34);
  --danger-ink:oklch(0.780 0.110 34);--danger-line:oklch(0.430 0.070 34);
  --info:oklch(0.680 0.110 250);
  --shadow-1:0 1px 2px rgba(0,0,0,.3);--shadow-2:0 4px 12px rgba(0,0,0,.35);--rail:#232624;
}}
:root[data-theme="dark"]{
  --bg:#1a1c1a;--surface:#232624;--surface-2:#1e211f;--surface-3:#2a2e2c;
  --ink:#f0eee8;--ink-2:#c5c2bb;--ink-3:#8a8780;--line:#353835;--line-strong:#4a4d49;
  --accent:oklch(0.673 0.093 var(--accent-hue));--accent-ink:oklch(0.780 0.090 var(--accent-hue));
  --accent-soft:oklch(0.300 0.032 var(--accent-hue));--accent-line:oklch(0.400 0.045 var(--accent-hue));
  --gold:oklch(0.78 0.10 82);--warn-bg:oklch(0.28 0.040 82);--warn-ink:oklch(0.84 0.090 82);
  --warn-line:oklch(0.42 0.060 82);
  --danger:oklch(0.640 0.130 34);--danger-bg:oklch(0.290 0.045 34);
  --danger-ink:oklch(0.780 0.110 34);--danger-line:oklch(0.430 0.070 34);
  --info:oklch(0.680 0.110 250);
  --shadow-1:0 1px 2px rgba(0,0,0,.3);--shadow-2:0 4px 12px rgba(0,0,0,.35);--rail:#232624;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:32px 18px 70px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-ink);margin:0 0 8px}
h1{font-size:30px;line-height:1.15;font-weight:700;margin:0 0 11px;letter-spacing:-.02em;text-wrap:balance}
.lede{font-size:15px;color:var(--ink-2);margin:0 0 9px;max-width:78ch}
.lede b{color:var(--ink)}
.note{font-size:12.5px;color:var(--ink-2);max-width:82ch}
.hint{font-size:11.5px;color:var(--ink-3)}
code,.mono{font-family:var(--font-mono);font-size:.9em}

.ctl{position:sticky;top:0;z-index:60;background:linear-gradient(var(--bg) 82%,transparent);
  padding:11px 0 12px;margin:22px 0 16px;display:flex;flex-direction:column;gap:9px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-pill);padding:3px;box-shadow:var(--shadow-1)}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;
  font-size:12.5px;font-weight:600;color:var(--ink-2);padding:6px 15px;border-radius:var(--r-pill);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.steps button{appearance:none;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  border-radius:var(--r-pill);padding:5px 11px;white-space:nowrap}
.steps button:hover{border-color:var(--accent-line);color:var(--ink)}
.steps button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.steps .g{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:0 6px 0 10px}
.steps .ar{color:var(--ink-3);font-size:11px}

.app{display:grid;grid-template-columns:84px 1fr;border:1px solid var(--line-strong);
  border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-2)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:9px 0;display:flex;flex-direction:column}
.rail .gh{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 5px 3px;text-align:center}
.rail i{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 3px;
  font-size:8.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:var(--ink-3);font-style:normal}
.rail i .e{font-size:15px;line-height:1}
.rail i.on{background:var(--accent-soft);color:var(--accent-ink)}
.rail i.gone{opacity:.32;text-decoration:line-through}
.pane{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.crumb{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);
  border-radius:var(--r-pill);padding:3px 9px;font-size:10.5px;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.pill b{color:var(--ink);font-weight:700}
.pill.live{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.dot.idle{background:var(--ink-3)}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}

.card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:14px 16px}
.card.tint{background:var(--surface-2)}
.card.sel{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line) inset}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sh h4{margin:0;font-size:14px;font-weight:700;letter-spacing:-.005em}
.sh .st{font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:var(--accent-ink);
  background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-pill);padding:1px 7px}
.sh .sub{font-size:11px;color:var(--ink-3);margin-left:auto;text-align:right}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.btn{appearance:none;font:inherit;font-size:12px;font-weight:600;border-radius:var(--r-control);
  padding:6px 13px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.d{border-color:var(--danger-line);color:var(--danger-ink);background:var(--danger-bg)}
.btn.s{font-size:10.5px;padding:3px 8px}
.btn.g{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.f{display:flex;flex-direction:column;gap:4px}
.f>label{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;justify-content:space-between;gap:6px}
.box{border:1px solid var(--line-strong);border-radius:var(--r-control);background:var(--surface);
  padding:7px 9px;font:inherit;font-size:12px;color:var(--ink);width:100%}
.box.t{min-height:58px;resize:vertical}
.box.ph{color:var(--ink-3)}
select.box{cursor:pointer}
.kb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px 16px}
.kb.k2{grid-template-columns:1fr 1fr}
.kn{display:flex;flex-direction:column;gap:3px}
.kr{display:flex;align-items:center;gap:7px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:3px;
  background:var(--line-strong);outline:none;min-width:52px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--accent);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;border:0}
input[type=range]:disabled{opacity:.35}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.num{width:54px;text-align:center;font-family:var(--font-mono);font-size:11px;
  border:1px solid var(--line-strong);border-radius:var(--r-control);padding:3px 4px;
  background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.u{font-size:10px;color:var(--ink-3);min-width:16px}
.radios{display:flex;flex-wrap:wrap;gap:4px}
.radio{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:3px 10px;
  cursor:pointer;color:var(--ink-2);background:var(--surface)}
.radio .rd{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none}
.radio.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.radio.on .rd{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.radio.off{opacity:.45;cursor:not-allowed}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
  border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:2px 7px;
  color:var(--ink-2);background:var(--surface);white-space:nowrap}
.tag.ok{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.tag.no{border-color:var(--line);color:var(--ink-3)}
.tag.w{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.tag.e{border-color:var(--danger-line);background:var(--danger-bg);color:var(--danger-ink)}
.tag.pd{border-color:var(--line-strong);background:var(--surface-3);color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.bn{border:1px solid var(--line);border-left:3px solid var(--info);background:var(--surface-2);
  border-radius:var(--r-control);padding:10px 12px;font-size:11.5px;color:var(--ink-2)}
.bn.w{border-left-color:var(--gold);background:var(--warn-bg);color:var(--warn-ink)}
.bn.e{border-left-color:var(--danger);background:var(--danger-bg);color:var(--danger-ink)}
.bn p{margin:4px 0 0}
.stack{border:1px solid var(--accent-line);border-radius:var(--r-card);background:var(--accent-soft);padding:11px 13px}
.stack h5{margin:0 0 6px;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.stack .l{font-size:12px;line-height:1.6}
.stack .sp{color:var(--accent);padding:0 2px}
.stack .lt{color:var(--ink-3);font-style:italic}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 7px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:6px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.spk{display:inline-flex;align-items:center;gap:5px;font-weight:650;font-size:11.5px}
.av{width:19px;height:19px;border-radius:50%;color:#fff;font-size:9.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.rt{display:inline-flex;gap:1px;color:var(--ink-3);font-size:11px}
.rt span{cursor:pointer;padding:1px 3px;border-radius:3px}
.rt span:hover{background:var(--surface-3);color:var(--ink)}
.player{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);
  border-radius:var(--r-control);background:var(--surface-2)}
.player .bar{flex:1;height:4px;border-radius:3px;background:var(--line-strong);position:relative;min-width:40px}
.player .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.rnd{border-radius:50%;width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.prog{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent)}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-card);padding:16px;
  text-align:center;color:var(--ink-3);font-size:12px;background:var(--surface-2)}
.exp{background:var(--surface-2);border-left:3px solid var(--accent)}
.exp td{padding:12px 14px}

.sec{margin:32px 0 12px;max-width:82ch}
.sec h2{font-size:19px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em;text-wrap:balance}
.map{display:flex;flex-wrap:wrap;gap:9px}
.mc{flex:1 1 190px;border:1px solid var(--line);border-radius:var(--r-card);padding:11px 13px;background:var(--surface)}
.mc.new{border-color:var(--accent-line);background:var(--accent-soft)}
.mc.gone{border-color:var(--danger-line);background:var(--danger-bg)}
.mc .k{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.mc.new .k{color:var(--accent-ink)}.mc.gone .k{color:var(--danger-ink)}
.mc .n{font-size:13px;font-weight:700;margin-bottom:3px}
.mc .d{font-size:11.5px;color:var(--ink-2)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.vs>div{border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;background:var(--surface)}
.vs h4{margin:0 0 7px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.vs .good h4,.good h4{color:var(--accent-ink)}.vs .bad h4,.bad h4{color:var(--danger-ink)}
.vs ul{margin:0;padding-left:16px;font-size:12px;color:var(--ink-2)}
.vs li{margin-bottom:5px}.vs li:last-child{margin-bottom:0}
.vs li b{color:var(--ink)}
/* Bulk verbs: button with a one-line subtitle under it (Alexandria's pattern —
   "Regenerate All" is terrifying without "re-render everything from scratch"). */
.verbs{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.verb{display:flex;flex-direction:column;gap:3px;max-width:190px}
.verb .vs{font-size:10.5px;color:var(--ink-3);line-height:1.35}
/* Cast table: the card is the row's expansion, same pattern as the chapter row. */
.castx td{background:var(--surface-2);border-left:3px solid var(--accent);padding:14px 16px}
.selcol{width:26px}
.screen{display:none}.screen.on{display:block}
/* Collapsed exception affordance — the per-line numeric override. */
.ovr summary{cursor:pointer;font-size:11px;font-weight:600;color:var(--ink-3);
  list-style:none;padding:4px 0;user-select:none}
.ovr summary::-webkit-details-marker{display:none}
.ovr summary:hover{color:var(--ink)}
.ovr[open] summary{color:var(--accent-ink)}
hr.r{border:0;border-top:1px solid var(--line);margin:34px 0 0}
@media (max-width:980px){
  .split,.split2,.kb,.kb.k2,.vs{grid-template-columns:1fr}
  .app{grid-template-columns:58px 1fr}h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
