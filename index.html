<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/justtts.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JustVoice</title>
    <!-- First-paint boot plate (family pattern, adopted for F1 2026-08-05) — the
         minimal brand plate (name + logo on the brand background, ruling 5: no
         artwork invention), shown instantly before the JS bundle parses. The SAME
         plate is App.vue's .splash, so boot is ONE continuous image: static plate
         → Vue splash (model load, when warm is on) → shell. KEEP the palette +
         layout IN SYNC with styles.css .splash. Vue's mount() replaces #app's
         content (the app, or the connection-error screen). -->
    <style>
      #app-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #fbfaf7; color: #6f6a62;
        font: 600 21px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
      }
      #app-boot img { width: 56px; height: 56px; }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #1b1917; color: #8c857c; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <img src="/justtts.svg" alt="" />
        <div>JustVoice</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
