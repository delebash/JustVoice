# SPDX-License-Identifier: MIT
name: Release

on:
  push:
    tags:
      - "v*"

# No concurrency group — release builds must never cancel each other.

permissions:
  contents: write # needed to create / update the GitHub release

# The desktop app is Electron + the Node server (the family's move, 2026-10-08); electron-builder
# makes the installers (package.json `build`). A packaged app also needs the audio.cpp DSP
# program, which ships in an audio.cpp release — that tag waits for the user's word (TASKS,
# the Electron item).
jobs:
  build:
    name: Installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --win
          - platform: macos-latest
            args: --mac --universal
          - platform: ubuntu-22.04
            args: --linux
    runs-on: ${{ matrix.platform }}
    steps:
      # The app needs the family kit beside it (package.json: file:../just-llm-runner/server;
      # vite.config.js: ../just-llm-runner/ui), so both are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: JustVioce
      - uses: actions/checkout@v4
        with:
          repository: delebash/just-llm-runner
          path: just-llm-runner

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            JustVioce/package-lock.json
            just-llm-runner/server/package-lock.json

      # better-sqlite3 and koffi ship per-platform N-API prebuilds, so nothing native is
      # compiled here; electron-builder packages the Electron the app pins.
      - name: Install the kit's server deps
        working-directory: just-llm-runner/server
        run: npm ci
      - name: Install deps
        working-directory: JustVioce
        run: npm ci

      # Signing: electron-builder signs when its variables are set and builds unsigned (with a
      # warning in its log) when they are not. macOS: the p12 (base64) and its password, plus
      # the Apple ID trio for notarization. Windows: the code-signing PFX (base64) and password.
      - name: Build the installers
        working-directory: JustVioce
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npx vite build && npx electron-builder ${{ matrix.args }} --publish never

      - name: Publish to the draft release
        working-directory: JustVioce
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft $PRE \
            --title "JustVoice $TAG" \
            --notes "See the assets below to download and install this version." \
            || gh release view "$TAG" >/dev/null  # another platform's job created it first
          shopt -s nullglob
          gh release upload "$TAG" release/*.exe release/*.dmg release/*.AppImage release/*.deb --clobber
