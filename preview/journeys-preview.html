<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>JustVoice — three journeys preview v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── Tokens — identical to approved v11 mock ── */
:root {
  --bg:#f6f5f1; --surface:#fff; --surface-2:#fbfaf7; --surface-3:#f3f1ec;
  --ink:#1a1a1a; --ink-2:#4a4a4a; --ink-3:#888;
  --line:#e3e1dc; --line-strong:#cfccc4;
  --accent:#3a7d63; --accent-ink:#2c6049; --accent-soft:#e8f0eb; --accent-line:#b8d2c3;
  --warn:#c89a3a; --warn-bg:#fff8e3; --warn-ink:#8a6a1f; --warn-line:#e6cd84;
  --danger:#a8442e; --danger-bg:#fbecea; --danger-ink:#7a2f1f; --danger-line:#e3b6ac;
  --info-blue:#2f74b5; --info-soft:#eaf2fa;
  --r-card:8px; --r-control:6px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(20,22,24,.04);
  --shadow-2:0 4px 12px rgba(20,22,24,.06);
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9e7e1;color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
p{margin:0;color:var(--ink-2)}
strong,b{font-weight:600;color:var(--ink)}
.muted{color:var(--ink-3)}
button{font:inherit}
.mono{font-family:var(--font-mono)}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.display{font-family:var(--font-serif);font-size:21px;font-weight:600;color:var(--ink)}
.display.sm{font-size:18px}

/* ── Director bar (mock-only chrome above the app frame) ── */
.director{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--ink);color:#fff;font-size:12.5px;position:sticky;top:0;z-index:60}
.director .jtab{border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.75);border-radius:999px;padding:4px 14px;font-size:12px;font-weight:600;cursor:pointer}
.director .jtab.active{background:#fff;color:var(--ink);border-color:#fff}
.director .steps{display:flex;gap:4px;margin-left:8px}
.director .stp{width:26px;height:26px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:11.5px;font-weight:600;cursor:pointer}
.director .stp.active{background:#9fd3bd;border-color:#9fd3bd;color:var(--ink)}
.director .navb{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:6px;padding:3px 12px;cursor:pointer;font-size:12px}
.director .navb:hover{background:rgba(255,255,255,.12)}
.director .hint{margin-left:auto;color:rgba(255,255,255,.55);font-size:11px}

/* ── Narration strip — what the user is doing at this step ── */
.narration{display:flex;align-items:baseline;gap:12px;padding:9px 18px;background:var(--warn-bg);border-bottom:1px solid var(--warn-line);font-size:12.5px;color:var(--warn-ink)}
.narration .who{font-weight:700;flex:none}
.narration .what{color:#6b5418}

/* ── App shell — identical structure to v11 ── */
.app{display:grid;grid-template-columns:80px 1fr;height:calc(100vh - 88px);overflow:hidden;background:var(--bg)}
.sidebar{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:2px;overflow-y:auto}
.brand{width:44px;height:44px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;margin-bottom:10px;flex:none}
.lane-h{width:56px;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;margin:8px 0 2px;font-weight:600}
.nav-item{width:56px;height:50px;border:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:transparent;color:var(--ink-2);flex:none}
.nav-item:hover{background:var(--surface);color:var(--ink)}
.nav-item.active,.nav-item.active:hover{background:var(--accent);color:#fff}
.nav-item .icon{font-size:16px;line-height:1}
.nav-item .lbl{font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;white-space:nowrap;max-width:54px;overflow:hidden;text-overflow:ellipsis}
.sidebar .spacer{flex:1}
main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{display:flex;align-items:baseline;gap:14px;padding:14px 32px 11px;border-bottom:1px solid var(--line);flex:none}
.topbar h1{font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.hdr-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:3px 11px;white-space:nowrap}
.hdr-chip .k{font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.status .dot{width:8px;height:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 3px rgba(58,125,99,.18)}
.status .url{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.content{flex:1;overflow:hidden;padding:14px 32px 18px;display:flex;flex-direction:column}
.content>section{flex:1;min-height:0;display:flex;flex-direction:column}
.lede{color:var(--ink-2);font-size:13px;margin:0 0 12px;max-width:880px}

/* ── Primitives (v11) ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--r-control);border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.94)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn.secondary:hover{background:var(--surface-2);filter:none}
.btn.ghost{background:transparent;color:var(--ink-2);border:0}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{display:block;height:34px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-control);color:var(--ink);font:inherit;font-size:13px;width:100%}
.input::placeholder{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;font-size:11px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);white-space:nowrap;line-height:17px}
.pill.green{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.pill.warn{color:var(--warn-ink);border-color:var(--warn-line);background:var(--warn-bg)}
.pill.blue{color:var(--info-blue);border-color:var(--info-blue);background:var(--info-soft)}
.pill.ghost{background:transparent;border-style:dashed}
.chips{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-control);padding:2px;gap:2px}
.chip{border:0;background:transparent;border-radius:4px;padding:4px 11px;font-size:12px;color:var(--ink-2);cursor:pointer}
.chip.active{background:var(--accent);color:#fff}
.banner{border-radius:var(--r-card);padding:10px 14px;font-size:12.5px;margin-bottom:10px}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
.banner.info{background:var(--info-soft);border:1px solid #bcd5ec;color:#235a8e}
.banner.good{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-ink)}
.prog{height:6px;background:var(--surface-3);border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:120px}
.prog .fill{height:100%;background:var(--accent)}
.glyph{width:20px;height:20px;border-radius:999px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;flex:none}
.vtable{width:100%;border-collapse:collapse;font-size:13px}
.vtable thead th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:2}
.vtable td{padding:7px 13px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
.vtable tbody tr:last-child td{border-bottom:0}
.vtable tbody tr:hover td{background:var(--surface-2)}
.vtable .right{text-align:right;white-space:nowrap}
.vtable .grp td{background:var(--surface-3);font-weight:600;color:var(--ink);font-size:12px;padding:6px 13px}

/* ── Kind picker ── */
.kind-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,290px));gap:14px;margin:8px 0 18px}
.kind-card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;text-align:left}
.kind-card:hover{border-color:var(--line-strong)}
.kind-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kind-card .big{font-size:26px;line-height:1}
.kind-card h3{font-family:var(--font-serif);font-size:17px}
.kind-card ul{margin:2px 0 0;padding-left:16px;font-size:12px;color:var(--ink-2);line-height:1.65}
.kind-foot{font-size:11px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}

/* ── Import / dropzone / mapping ── */
.dropzone{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--line-strong);background:var(--surface-2);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.filechip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px}
.filechip .ext{font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--ink);color:#fff;border-radius:4px;padding:1px 5px}
.map-row{display:grid;grid-template-columns:170px 22px 200px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.map-row:last-child{border-bottom:0}
.map-src{font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.map-sel{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;font-size:12.5px;color:var(--ink)}
.two-col{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:16px;flex:1;min-height:0}
.two-col>.card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.card-b{padding:12px 16px;overflow-y:auto;flex:1;min-height:0}
.sum-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sum-row:last-child{border-bottom:0}
.sum-row b{font-variant-numeric:tabular-nums}

/* ── Script lines (v11) ── */
.line-row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:12.5px}
.line-row .sp{display:inline-flex;align-items:center;gap:6px;flex:none;font-weight:600;font-size:12px;width:150px}
.line-row .txt{flex:1;min-width:0;color:var(--ink-2);line-height:1.45}
.line-row .kind{flex:none;width:92px}
.line-row .acc{flex:none;width:86px}
.scroll-fill{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 8px 10px 2px}

/* ── Cast cards (v11) ── */
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cast-card{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left}
.cast-card.unassigned{border-style:dashed}
.cast-card.narrator{grid-column:1 / -1}
.portrait{width:44px;height:44px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:600;font-size:16px;flex:none}
.cast-role{font-size:11px;color:var(--ink-3);margin-top:1px}
.cast-voice{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px}
.cast-unassigned{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:5px;padding:2px 8px}

/* ── Folder tree / code preview ── */
.tree{font-family:var(--font-mono);font-size:12px;line-height:1.85;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;overflow:auto}
.tree b{color:var(--ink);font-weight:600}
.tree .dim{color:var(--ink-3)}
.codeblock{font-family:var(--font-mono);font-size:11.5px;line-height:1.7;background:#23272b;color:#d6dde3;border-radius:8px;padding:12px 16px;overflow:auto;white-space:pre}
.codeblock .k{color:#9fd3bd}.codeblock .s{color:#e6cd84}

/* ── Timeline (podcast assembly) ── */
.tl{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tl-ruler{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2);font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.tl-ruler span{flex:1;padding:4px 0 4px 8px;border-left:1px solid var(--line)}
.tl-ruler span:first-child{border-left:0}
.tl-track{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:46px;position:relative}
.tl-track:last-child{border-bottom:0}
.tl-label{width:110px;flex:none;font-size:11px;font-weight:600;color:var(--ink-2);padding:0 12px;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center;background:var(--surface-2)}
.tl-lane{flex:1;display:flex;gap:3px;padding:7px 8px;overflow:hidden}
.tl-block{height:30px;border-radius:6px;font-size:10.5px;font-weight:600;display:flex;align-items:center;padding:0 8px;color:#fff;white-space:nowrap;overflow:hidden;flex:none}
.tl-block.v1{background:var(--accent)}
.tl-block.v2{background:#7e9cc4}
.tl-block.v3{background:#c98aa7}
.tl-block.mus{background:#a59060;height:22px;font-size:10px}
.tl-block.sfx{background:#888;height:22px;font-size:10px}

/* segment rows (podcast script) */
.seg{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:12.5px}
.seg .who{flex:none;width:96px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.seg .txt{flex:1;color:var(--ink-2);line-height:1.5}
.tagp{display:inline-block;font-family:var(--font-mono);font-size:10.5px;background:var(--info-soft);color:var(--info-blue);border-radius:4px;padding:0 5px;margin:0 2px}
.seg .mark{flex:none;font-size:11px;color:var(--ink-3)}
.seg.music{background:var(--surface-3);border-style:dashed;color:var(--ink-3);font-size:12px}

/* voice library aside (v11) */
.voice-row{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font-size:12.5px;color:var(--ink)}
.voice-row:hover{border-color:var(--line-strong)}
.voice-row.assigned{border-color:var(--accent);background:var(--accent-soft)}
.voice-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-row .nm i{display:block;font-size:10px;color:var(--ink-3);font-style:italic}
.voice-row .check{color:var(--accent);font-weight:700}
.picking{font-size:11.5px;color:var(--ink-2);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:5px 10px;margin-bottom:10px}
.combo-cell{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12.5px}
.combo-cell:hover{border-color:var(--line-strong)}
.combo-cell .chev{color:var(--ink-3);font-size:9px;margin-left:2px}

/* checklists */
.ckl{list-style:none;margin:0;padding:0;font-size:12.5px}
.ckl li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.ckl li:last-child{border-bottom:0}
.ckl .ok{color:var(--accent-ink);font-weight:700}
.demo-note{position:fixed;right:18px;bottom:12px;font-size:11px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;box-shadow:var(--shadow-1);z-index:55}
</style>
</head>
<body>

<div class="director" id="director"></div>
<div class="narration" id="narration"></div>
<div class="app" id="app"></div>
<div class="demo-note">Design mock — nothing wired. ← → keys step through. Hash deep-links: #game/3</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   Seeded fake data — three demo projects, one per audience
   ════════════════════════════════════════════════════════════════════ */
const C = { mara:"#7c5cbf", tom:"#b3552e", edith:"#2e7d8a", stranger:"#555", doc:"#a8763e", narr:"#3a7d63",
            guard:"#5b7a99", vyra:"#7c5cbf", brann:"#b3552e", keeper:"#2e7d8a", scout:"#a8763e", merchant:"#947b2f", child:"#c98aa7", ghost:"#777", warden:"#444",
            sarah:"#3a7d63", jin:"#7e9cc4", mave:"#c98aa7" };

const BOOK = {
  title:"Stillwater", author:"S. K. Holloway", file:"stillwater.epub",
  chapters:[
    ["1 · The Lake House", 4210, "31 min"], ["2 · What the Water Keeps", 3870, "29 min"],
    ["3 · Mara", 5120, "38 min"], ["4 · The Visitor", 3340, "25 min"],
    ["5 · Old Debts", 4660, "35 min"], ["6 · The Storm Cellar", 3980, "30 min"],
    ["7 · Undertow", 4450, "33 min"], ["8 · Stillwater", 2890, "22 min"]],
  cast:[
    ["Mara Vance","protagonist · 214 lines","mara","Mara (cloned)"],

    ["Doc Ainsley","town doctor · 41 lines","doc","am_echo (Kokoro)"],
    ["Tom Harlan","neighbor · discovered in ch. 4","tom",null],
    ["The Stranger","discovered in ch. 6","stranger",null]],
  lines:[
    ["Narrator","narration","The lake had a way of holding the morning fog long after the sun should have burned it off.","98%","narr"],
    ["Mara Vance","dialogue","“You knew. All these years, you knew and you let me think it was my fault.”","96%","mara"],
    ["Edith Vance","dialogue","“Sit down, child. Some things only make sense told in order.”","94%","edith"],
    ["Narrator","narration","Edith's hands didn't shake as she poured the tea. That was the first thing Mara noticed.","97%","narr"],
    ["Tom Harlan","dialogue","“Your grandmother ever tell you what's under the boathouse?”","88%","tom"],
    ["Mara Vance","thought","If he was lying, he was better at it than anyone in this town.","81%","mara"],
    ["The Stranger","dialogue","“Stillwater keeps what it's given. You'd do well to remember that.”","73%","stranger"]]
};

const GAME = {
  title:"Emberfall — Act 1 VO", file:"emberfall_act1_dialogue.csv",
  quests:[["Q01","Ashfall Village",18],["Q02","The Ember Gate",23],["Q03","Wardens of the Deep",31],["Q04","The Merchant's Debt",14],["Q05","Cinders & Salt",22],["Q06","The Long Dark",16]],
  npcs:[["Guard Captain Hale","guard",31,"Old Crow (cloned)"],["Vyra the Seer","vyra",22,"Mara (cloned)"],["Brann Ironhand","brann",19,"am_onyx (Kokoro)"],["The Gatekeeper","keeper",12,"Blend: Narrator+Crow"],["Scout Ferris","scout",11,"am_echo (Kokoro)"],["Merchant Odo","merchant",10,"am_adam_k (Kokoro)"],["Lost Child","child",8,"af_jessica (Kokoro)"],["The Hollow Voice","ghost",6,null],["Warden Prime","warden",5,null]],

const JOURNEYS = {
  audiobook:{ label:"📖 Audiobook — Sarah", steps:stepsAudiobook, who:"Sarah · indie author" },
  game:     { label:"🎮 Game — Marcus",     steps:stepsGame,      who:"Marcus · solo game dev" },
  podcast:  { label:"🎙️ Podcast — Priya",   steps:stepsPodcast,   who:"Priya · podcast producer" },
  firstrun: { label:"🚀 First run — Alex",  steps:stepsFirstrun,  who:"Alex · brand-new user" },
  dictation:{ label:"⌨️ Live voice — Dana", steps:stepsDictation, who:"Dana · streamer, limited speech" },
  fixit:    { label:"🔤 Fix-it loop",        steps:stepsFixit,     who:"Sarah · pronunciation pass" },
  flow:     { label:"🧭 Identity flow",      steps:stepsFlow,      who:"Concept map" },
};
let cur = { j:"audiobook", s:0 };

function render(){
  const J = JOURNEYS[cur.j], step = J.steps[cur.s];
  document.getElementById("director").innerHTML = `
    ${Object.entries(JOURNEYS).map(([id,j])=>`<button class="jtab ${id===cur.j?'active':''}" onclick="go('${id}',0)">${j.label}</button>`).join("")}
    <span class="steps">${J.steps.map((_,i)=>`<button class="stp ${i===cur.s?'active':''}" onclick="go('${cur.j}',${i})">${i+1}</button>`).join("")}</span>
    <button class="navb" onclick="move(-1)">←</button><button class="navb" onclick="move(1)">→</button>
    <span class="hint">step ${cur.s+1} of ${J.steps.length} · design mock, nothing wired</span>`;
  document.getElementById("narration").innerHTML =
    `<span class="who">${J.who}</span><span class="what">${step.t}</span>`;
  document.getElementById("app").innerHTML = step.html();
  location.hash = `${cur.j}/${cur.s+1}`;
}
function go(j,s){ cur={j,s}; render(); }
function move(d){
  const J=JOURNEYS[cur.j]; let s=cur.s+d;
  if(s<0||s>=J.steps.length){
    const ids=Object.keys(JOURNEYS), i=ids.indexOf(cur.j)+d;
    if(i<0||i>=ids.length) return;
    cur={j:ids[i], s:d>0?0:JOURNEYS[ids[i]].steps.length-1};
  } else cur.s=s;
  render();
}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowLeft") move(-1);
});
(function init(){
  const m = location.hash.match(/^#(audiobook|game|podcast|firstrun|dictation|fixit|flow)\/(\d+)/);
  if(m){ cur.j=m[1]; cur.s=Math.min(parseInt(m[2])-1, JOURNEYS[m[1]].steps.length-1); }
  render();
})();
</script>
