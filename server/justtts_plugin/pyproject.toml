[project]
name = "justtts-plugin"
version = "0.1.0"
description = "Shared base classes + FastAPI shim for JustTTS engine plugins. Engines import EmbeddedEngine + serve() to expose themselves as managed subprocesses to the JustTTS host server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "JustTTS contributors" }]
keywords = ["tts", "plugin", "justtts"]

# Kept intentionally light. Every engine venv installs this; we don't want
# to pull torch / transformers / numpy via this package — those are the
# engine's own deps. numpy is the one exception because every audio output
# eventually comes from a numpy array and the helper code paths assume it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["justtts_plugin*"]
