# SPDX-License-Identifier: MIT
name: CodeQL

# Run by hand only (the user, 2026-10-28: "i dont ever want an automatic build of anything i only want stuff to build
# when i say so") — the Actions page's "Run workflow", or `gh workflow run codeql.yml`.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL — javascript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # Everything is JavaScript since the Electron move (2026-10-08): the renderer, the Node
    # server and the desktop shell. No dependency install is needed for the scan.
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          # Exclude vendored / generated paths
          config: |
            paths-ignore:
              - "legacy-gui/**"
              - "dist/**"
              - "release/**"
              - "**/*.min.js"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
