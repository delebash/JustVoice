# SPDX-License-Identifier: MIT
name: CodeQL

on:
  schedule:
    # Every Monday at 03:17 UTC
    - cron: "17 3 * * 1"
  # Allow manual trigger for ad-hoc scans
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL — javascript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # Everything is JavaScript since the Electron move (2026-10-08): the renderer, the Node
    # server and the desktop shell. No dependency install is needed for the scan.
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # Exclude vendored / generated paths
          config: |
            paths-ignore:
              - "legacy-gui/**"
              - "dist/**"
              - "release/**"
              - "**/*.min.js"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
